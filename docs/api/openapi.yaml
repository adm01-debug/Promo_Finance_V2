openapi: 3.0.3
info:
  title: Promo Finance V2 — API pública (edge functions)
  description: >-
    Contrato externo das edge functions chamadas por sistemas de terceiros
    (provedores de cobrança, ERPs, IdPs, n8n) e utilitários públicos.
    Todas as rotas vivem sob {SUPABASE_URL}/functions/v1/. As ~90 funções
    internas (chamadas só pelo app autenticado) não fazem parte deste
    contrato. Schemas espelham os zod de
    supabase/functions/_shared/validation.ts — divergência entre este
    documento e o schema zod = bug neste documento.

    **Versionamento de contrato (webhooks):** os quatro webhooks aceitam
    o seletor `x-contract-version: v2` no header OU o envelope
    `{contract_version: "v2", data: {...payload}}` no corpo (o campo data é
    desembrulhado antes da validação). Sem seletor a requisição cai
    silenciosamente em v1 — para o contrato v2 (idempotência obrigatória)
    envie um dos dois seletores.
  version: '1.0.0'
servers:
  - url: https://bwwbeyolnnzppeuhgkcd.supabase.co/functions/v1
tags:
  - name: webhooks
    description: Eventos inbound de provedores externos
  - name: identidade
    description: SSO e provisionamento SCIM
  - name: automacao
    description: Callbacks de automação (n8n)
  - name: util
    description: Health e chaves públicas de configuração

paths:
  /asaas-webhook:
    post:
      tags: [webhooks]
      summary: Eventos de cobrança do Asaas
      description: >-
        Recebe eventos PAYMENT_*/TRANSFER_* do Asaas. Autenticado pelo header
        asaas-access-token (configurado no painel Asaas → Integrações →
        Webhooks). Idempotente por id/eventId — reenvio retorna 200 sem
        reprocessar. Falha de processamento retorna 200 com
        {success: false, will_retry} e a retentativa acontece na fila interna
        (retry/DLQ próprios — o Asaas não retransmite); 5xx só em erro fatal
        fora do fluxo e 4xx em erro de validação.
      parameters:
        - name: asaas-access-token
          in: header
          required: true
          schema: { type: string }
          description: Token de verificação configurado no Asaas
        - name: x-contract-version
          in: header
          required: false
          schema: { type: string, enum: [v1, v2] }
          description: >-
            Seletor de contrato (alternativa ao envelope
            {contract_version, data} no corpo); sem ele assume v1.
            No v2,
            o campo `id` é obrigatório (idempotência)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/AsaasWebhook'
                - type: object
                  required: [contract_version, data]
                  properties:
                    contract_version: { type: string, enum: [v2] }
                    data:
                      $ref: '#/components/schemas/AsaasWebhookV2'
      responses:
        '200':
          description: >-
            Evento aceito — também usado para duplicado ({success:true,
            duplicated:true}) e falha de processamento que segue para a fila
            interna ({success:false, will_retry, status}).
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success: { type: boolean }
                  duplicated:
                    type: boolean
                    description: Presente quando o evento já havia sido processado
                  will_retry:
                    type: boolean
                    description: 'Em success:false — a retentativa acontece na fila interna'
                  status:
                    type: integer
                    description: 'Em success:false — status HTTP equivalente à falha'
        '422':
          $ref: '#/components/responses/ErroValidacaoContrato'
        '403':
          description: Token do webhook ausente ou inválido
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: >-
            Exceção interna no processamento ({error: <mensagem>}) —
            erro de aplicação, não de contrato
        '503':
          description: >-
            ASAAS_WEBHOOK_TOKEN não configurado no servidor ({error:
            "Webhook não configurado"}) — fail-closed; NÃO é transitório:
            reenvios falham até o segredo ser provisionado

  /bling-webhook:
    post:
      tags: [webhooks]
      summary: Eventos do ERP Bling
      description: >-
        Recebe callbacks do Bling (notas fiscais, pedidos, estoque). Credencial
        verificada ANTES do parse do corpo (a assinatura cobre os bytes
        originais): HMAC-SHA256 do corpo em x-bling-signature-256 (também
        aceitos x-bling-signature, x-signature ou x-webhook-signature, com ou
        sem prefixo "sha256="), ou o token compartilhado em x-webhook-token.
        Sem credencial válida → 401; sem segredo configurado no servidor →
        503 (fail-closed). Idempotente por eventId — obrigatório no contrato
        v2 (ver Versionamento de contrato no topo do documento).
      parameters:
        - name: x-bling-signature-256
          in: header
          required: false
          schema: { type: string }
          description: >-
            HMAC-SHA256 hex ou base64 do corpo bruto (aceita também
            x-bling-signature, x-signature, x-webhook-signature)
        - name: x-webhook-token
          in: header
          required: false
          schema: { type: string }
          description: Alternativa ao HMAC — token compartilhado do domínio
        - name: x-contract-version
          in: header
          required: false
          schema: { type: string, enum: [v1, v2] }
          description: >-
            Seletor de contrato (alternativa ao envelope
            {contract_version, data} no corpo); sem ele assume v1.
            No v2,
            o campo `eventId` é obrigatório (idempotência)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/BlingWebhook'
                - type: object
                  required: [contract_version, data]
                  properties:
                    contract_version: { type: string, enum: [v2] }
                    data:
                      $ref: '#/components/schemas/BlingWebhookV2'
      responses:
        '200': { description: Evento aceito }
        '422': { $ref: '#/components/responses/ErroValidacaoContrato' }
        '401': { description: Assinatura/secret inválidos ou ausentes }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503':
          description: >-
            Webhook não configurado no servidor ({error: "Webhook não
            configurado"}) ou rate limiter indisponível
            ({error: "rate_limit_indisponivel"})

  /bitrix24-webhook:
    post:
      tags: [webhooks]
      summary: Eventos do Bitrix24
      description: >-
        Recebe eventos outbound do Bitrix24 (entidades CRM). Autenticado por
        application_token no payload auth ou secret resolvido por domínio.
      parameters:
        - name: x-contract-version
          in: header
          required: false
          schema: { type: string, enum: [v1, v2] }
          description: >-
            Seletor de contrato (alternativa ao envelope
            {contract_version, data} no corpo); sem ele assume v1.
            No v2,
            o campo `event_id` é obrigatório (idempotência)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/Bitrix24Webhook'
                - type: object
                  required: [contract_version, data]
                  properties:
                    contract_version: { type: string, enum: [v2] }
                    data:
                      $ref: '#/components/schemas/Bitrix24WebhookV2'
      responses:
        '200': { description: Evento aceito }
        '422': { $ref: '#/components/responses/ErroValidacaoContrato' }
        '401': { description: Token inválido }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503':
          description: >-
            Webhook não configurado no servidor ({error: "Webhook não
            configurado"}) — falha fechada antes da validação do payload;
            não é erro de credencial do cliente

  /whatsapp-webhook:
    post:
      tags: [webhooks]
      summary: Eventos de mensagem (Evolution API / WhatsApp)
      description: >-
        Autenticado ANTES do payload: assinatura HMAC em
        `x-hub-signature-256`, `x-signature` ou `x-webhook-signature`, ou o
        token compartilhado em `x-webhook-token`. Sem credencial → 401 mesmo
        com corpo válido (fail-closed).
      parameters:
        - name: x-webhook-token
          in: header
          required: false
          schema: { type: string }
          description: Alternativa ao HMAC — token compartilhado do domínio
        - name: x-signature
          in: header
          required: false
          schema: { type: string }
          description: HMAC do corpo (ou x-hub-signature-256 / x-webhook-signature)
        - name: x-contract-version
          in: header
          required: false
          schema: { type: string, enum: [v1, v2] }
          description: >-
            Seletor de contrato (alternativa ao envelope
            {contract_version, data} no corpo); sem ele assume v1.
            No v2,
            o campo `messageId` é obrigatório (idempotência)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/WhatsappWebhook'
                - type: object
                  required: [contract_version, data]
                  properties:
                    contract_version: { type: string, enum: [v2] }
                    data:
                      $ref: '#/components/schemas/WhatsappWebhookV2'
      responses:
        '200': { description: Evento aceito }
        '422': { $ref: '#/components/responses/ErroValidacaoContrato' }
        '401': { description: Credencial de webhook ausente ou inválida }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503':
          description: >-
            Webhook não configurado no servidor ({error: "Webhook não
            configurado"}) — fail-closed antes de processar o corpo;
            não é erro de credencial do cliente

  /n8n-callback:
    post:
      tags: [automacao]
      summary: Callback de workflows n8n
      description: >-
        Endpoint genérico para workflows n8n gravarem resultados. Autenticado
        pelo header x-n8n-secret (comparado a N8N_CALLBACK_SECRET).
      parameters:
        - name: x-n8n-secret
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, payload]
              properties:
                action:
                  type: string
                  enum: [create_task, create_alert, log]
                payload:
                  type: object
                  description: >-
                    Campos por action: create_alert usa
                    {alert_type, severity, title, message, description,
                    deal_id, driver_id, order_id, record_id} (title é
                    opcional — sem ele o servidor usa o fallback
                    'Alerta via n8n'); create_task aceita
                    subject ou title; log usa {action, message, ...}.
      responses:
        '200':
          description: Ação executada
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  action: { type: string }
                  result: { type: object }
        '400':
          description: >-
            JSON malformado ({error: invalid_json}) ou corpo fora do
            contrato action/payload ({error, details})
        '401': { description: x-n8n-secret inválido }
        '405': { description: Método diferente de POST }
        '503':
          description: >-
            N8N_CALLBACK_SECRET não configurado no servidor —
            {error: "secret_not_configured"}; não é erro de credencial do
            cliente

  /sso-initiate:
    post:
      tags: [identidade]
      summary: Inicia fluxo SSO (SAML ou OIDC)
      description: >-
        Retorna a URL de autorização do IdP. Para SAML devolve a URL nativa do
        Supabase; para OIDC monta authorize com PKCE a partir da
        authorization_endpoint/discovery_url do provedor.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider_id]
              properties:
                provider_id: { type: string, format: uuid }
                redirect_to: { type: string, format: uri, nullable: true }
      responses:
        '200':
          description: URL de redirecionamento para o IdP + artefatos PKCE (OIDC)
          content:
            application/json:
              schema:
                type: object
                properties:
                  redirect_url: { type: string, format: uri }
                  type: { type: string, enum: [saml, oidc] }
                  verifier:
                    type: string
                    description: >-
                      PKCE code_verifier — só no fluxo OIDC. O cliente DEVE
                      persistir (sessionStorage) e devolvê-lo no /sso-callback;
                      sem ele a troca do code é rejeitada.
                  state:
                    type: string
                    description: >-
                      Nonce anti-CSRF — só no fluxo OIDC; devolvido pelo IdP
                      na query do /sso-callback.
        '400': { $ref: '#/components/responses/ErroValidacao' }
        '404': { description: Provedor não encontrado ou inativo }
        '429': { description: Mais de 10 tentativas por provedor — aplicar backoff }
        '500': { description: Falha inesperada no servidor }
        '502': { description: Discovery OIDC do IdP falhou — IdP indisponível }

  /sso-callback:
    get:
      tags: [identidade]
      summary: Conclui fluxo OIDC (code → sessão)
      description: >-
        Callback que o IdP chama via redirect: lê code/state da query (e
        verifier opcional na query ou no corpo), troca o authorization code
        (com PKCE) e provisiona o usuário na empresa, respondendo redirect
        ou magic link conforme o fluxo.
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string }
        - name: state
          in: query
          required: true
          schema: { type: string }
        - name: verifier
          in: query
          required: false
          schema: { type: string }
          description: >-
            Obrigatório no fluxo OIDC (PKCE): o code_verifier persistido pelo
            cliente no /sso-initiate. Sem ele a troca do code é rejeitada.
      responses:
        '302':
          description: >-
            Redirect para a aplicação — tanto no sucesso (sessão/magic link)
            quanto em QUALQUER falha do fluxo: o handler sempre responde 302
            para /auth?sso_error=<código> (missing_code_or_state,
            state_invalid_or_expired, pkce_verifier_missing, pkce_mismatch,
            provider_missing, token_exchange_failed, no_email_claim e outros).
            Não há respostas JSON 4xx nesta operação — o cliente deve ler o
            sso_error na query do redirect.
    post:
      tags: [identidade]
      summary: Finaliza fluxo SAML (vínculo, papel e auditoria)
      description: >-
        Chamado pelo frontend após o retorno do broker SAML com a sessão já
        autenticada: aplica o vínculo do usuário à empresa do provedor, o
        papel default e registra a auditoria do login SSO. Requer
        `Authorization: Bearer <access_token>` da sessão Supabase.
      parameters:
        - name: Authorization
          in: header
          required: true
          schema: { type: string }
          description: Bearer access_token da sessão Supabase pós-broker
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, provider_id]
              properties:
                kind: { type: string, enum: [saml-finalize] }
                provider_id: { type: string, format: uuid }
      responses:
        '200':
          description: Vínculo aplicado — JSON com o resultado do provisionamento
        '400':
          description: provider_id_required ou erro de validação ({error, details})
        '401':
          description: 'Sessão ausente ({error: unauthorized}) ou inválida ({error: invalid_token})'
        '404':
          description: 'Provedor ({error: provider_missing}) ou usuário ({error: user_not_found}) não encontrado'

  /scim-server/scim/v2/ServiceProviderConfig:
    get:
      tags: [identidade]
      summary: Capabilities SCIM 2.0
      description: >-
        Discovery PÚBLICO — atendido antes da checagem de Authorization;
        qualquer cliente recebe 200 sem bearer token.
      responses:
        '200': { description: ServiceProviderConfig (patch suportado; etag NÃO implementado — o payload retorna `etag.supported=false`) }

  /scim-server/scim/v2/ResourceTypes:
    get:
      tags: [identidade]
      summary: ResourceTypes SCIM 2.0
      description: Discovery PÚBLICO (sem autenticação).
      responses:
        '200': { description: ListResponse com os ResourceTypes User e Group }

  /scim-server/scim/v2/Schemas:
    get:
      tags: [identidade]
      summary: Schemas SCIM 2.0
      description: Discovery PÚBLICO (sem autenticação).
      responses:
        '200': { description: 'ListResponse com os schemas User, Group e a extensão EnterpriseUser (urn:ietf:params:scim:schemas:extension:enterprise:2.0:User)' }

  /scim-server/scim/v2/Users:
    get:
      tags: [identidade]
      summary: Lista usuários provisionados
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: filter, in: query, schema: { type: string }, description: 'SCIM filter (ex.: userName eq "a@b.com")' }
        - { name: startIndex, in: query, schema: { type: integer, default: 1 } }
        - { name: count, in: query, schema: { type: integer } }
      responses:
        '200': { description: ListResponse SCIM }
        '400': { description: 'Filtro inválido ou atributo não suportado — {scimType: "invalidFilter", detail}' }
        '401': { description: Bearer token SCIM inválido }
    post:
      tags: [identidade]
      summary: Provisiona usuário em user_empresas + user_roles
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/scim+json:
            schema: { $ref: '#/components/schemas/ScimUser' }
      responses:
        '201':
          description: >-
            'User criado — a criação é idempotente: userName já
            provisionado localiza o usuário existente, faz upsert do
            vínculo user_empresas e responde 201. Sem header Location
            (o recurso retorna com id no corpo)'
        '400': { $ref: '#/components/responses/ErroValidacao' }
        '401': { description: Bearer token SCIM inválido }

  '/scim-server/scim/v2/Users/{id}':
    get:
      tags: [identidade]
      summary: Lê usuário por id
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ScimId' }]
      responses:
        '200': { description: User SCIM }
        '404': { description: Não encontrado }
    patch:
      tags: [identidade]
      summary: Patch SCIM (active, displayName, name.*, externalId, department)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ScimId' }]
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              type: object
              properties:
                schemas: { type: array, items: { type: string } }
                Operations:
                  type: array
                  items:
                    type: object
                    properties:
                      op: { type: string, enum: [add, remove, replace] }
                      path: { type: string }
                      value: {}
      responses:
        '200': { description: User atualizado }
        '404': { description: Não encontrado }
    put:
      tags: [identidade]
      summary: Substitui o usuário inteiro
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ScimId' }]
      requestBody:
        required: true
        content:
          application/scim+json:
            schema: { $ref: '#/components/schemas/ScimUser' }
      responses:
        '200': { description: User substituído }
        '404': { description: Não encontrado }
    delete:
      tags: [identidade]
      summary: Desprovisiona (desativa vínculo user_empresas)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ScimId' }]
      responses:
        '204': { description: Desprovisionado }
        '404': { description: Não encontrado }

  /scim-server/scim/v2/Groups:
    get:
      tags: [identidade]
      summary: Lista grupos/papéis provisionáveis
      security: [{ bearerAuth: [] }]
      parameters:
        - name: filter
          in: query
          required: false
          schema: { type: string }
          description: >-
            Filtro SCIM por displayName/externalId (sintaxe `attr eq
            "valor"`, combinável com `and`); filtro não suportado → 400
        - name: startIndex
          in: query
          required: false
          schema: { type: integer, default: 1 }
        - name: count
          in: query
          required: false
          schema: { type: integer, default: 50, maximum: 200 }
      responses:
        '200': { description: ListResponse SCIM }
        '400': { description: 'Filtro inválido — {scimType: "invalidFilter", detail}' }
    post:
      tags: [identidade]
      summary: Cria mapeamento de grupo → papel
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              type: object
              required: [displayName]
              properties:
                displayName: { type: string }
                members:
                  type: array
                  items:
                    type: object
                    properties:
                      value: { type: string }
      responses:
        '201': { description: 'Group criado — sem header Location (o recurso retorna com id no corpo)' }
        '400': { description: 'displayName ausente — {error: "displayName required"}' }

  '/scim-server/scim/v2/Groups/{id}':
    get:
      tags: [identidade]
      summary: Lê grupo por id
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ScimId' }]
      responses:
        '200': { description: Group SCIM }
        '404': { description: Não encontrado }
    patch:
      tags: [identidade]
      summary: Patch de membros do grupo
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ScimId' }]
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              type: object
              properties:
                schemas: { type: array, items: { type: string } }
                Operations:
                  type: array
                  items:
                    type: object
                    properties:
                      op: { type: string, enum: [add, remove, replace] }
                      path:
                        type: string
                        description: 'Ex.: members, displayName'
                      value: {}
      responses:
        '200': { description: Group atualizado }
    put:
      tags: [identidade]
      summary: Substitui o grupo inteiro (membros inclusos)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ScimId' }]
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              type: object
              required: [displayName]
              properties:
                displayName: { type: string }
                members:
                  type: array
                  items:
                    type: object
                    properties:
                      value: { type: string }
      responses:
        '200': { description: Group substituído }
        '404': { description: Não encontrado }
    delete:
      tags: [identidade]
      summary: Remove o mapeamento de grupo
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ScimId' }]
      responses:
        '204': { description: Removido }

  /validar-token-contador:
    post:
      tags: [identidade]
      summary: Valida token JWT de contador convidado
      description: >-
        Verifica assinatura/expiração do token emitido por convidar-contador e
        devolve {success, empresa, convite} para o fluxo de aceite sem login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200':
          description: Token validado
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  empresa:
                    type: object
                    description: Empresa dona do convite
                  convite:
                    type: object
                    properties:
                      email: { type: string, format: email }
                      expires_at: { type: string, format: date-time }
        '400': { description: 'Claims malformados — {error: "Token malformado"}' }
        '401': { description: JWT inválido ou expirado }
        '403': { description: Role incorreta, convite revogado ou convite expirado }
        '404': { description: Convite ou empresa não encontrados }
        '422':
          $ref: '#/components/responses/ErroValidacaoContrato'

  /health:
    get:
      tags: [util]
      summary: Liveness público
      description: >-
        Público (sem JWT): {status:'ok'|'outage', timestamp, services} — o
        bloco services também é retornado no público, mas só como esqueleto
        de status agregado (edge_runtime, database, realtime,
        external_apis.asaas/bling), sem internals; 503 quando o probe do
        banco falha. Usuário autenticado: status 'operational'|'degraded' e o
        mesmo bloco services detalhado por serviço.
      responses:
        '200':
          description: Sistema no ar (status ok/outage no público; operational/degraded autenticado)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok, outage, operational, degraded]
                    description: ok/outage no público; operational/degraded autenticado
                  timestamp: { type: string, format: date-time }
                  services:
                    type: object
                    description: >-
                      Status agregado por serviço (operational/degraded/outage)
                      — retornado também no público como esqueleto sem internals
        '503': { description: Probe público falhou — status 'outage' }

  /get-vapid-key:
    get:
      tags: [util]
      summary: Chave pública VAPID para Web Push
      responses:
        '200':
          description: Chave pública (subject/applicationServerKey do push)
          content:
            application/json:
              schema:
                type: object
                properties:
                  vapidPublicKey: { type: string }
        '500':
          description: >-
            VAPID_PUBLIC_KEY não configurada ({error: "VAPID key not
            configured"}) ou exceção interna — indisponibilidade do
            servidor, não do cliente

  /get-mapbox-token:
    get:
      tags: [util]
      summary: Token público do Mapbox
      security: [{ userJwt: [] }]
      description: >-
        Exige JWT de usuário autenticado (verify_jwt = true no gateway):
        chamada anônima é rejeitada pelo gateway antes do handler.
      responses:
        '401':
          description: JWT ausente ou inválido — rejeitado no gateway
        '200':
          description: Token de escopo público (pk.*)
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
        '500':
          description: >-
            MAPBOX_ACCESS_TOKEN não configurado no servidor ({error:
            "MAPBOX_ACCESS_TOKEN não configurado"}) — indisponibilidade
            de configuração, não falha de autenticação

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: token
      description: >-
        Token SCIM opaco por provedor (secrets scim_tokens) — válido
        SOMENTE nos endpoints /scim-server/*; não é um JWT e não passa
        no gateway das demais funções
    userJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        JWT de usuário do Supabase Auth — exigido pelo gateway
        (verify_jwt = true) nas funções autenticadas por usuário

  parameters:
    ScimId:
      name: id
      in: path
      required: true
      schema: { type: string }

  responses:
    ErroValidacao:
      description: Payload fora do contrato (detalhes zod)
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
              details: { type: object }
    ErroValidacaoContrato:
      description: >-
        HTTP 422 — envelope canônico de createValidationErrorResponse usado
        pelos webhooks versionados (validateVersionedContract)
      content:
        application/json:
          schema:
            type: object
            properties:
              code: { type: string, enum: [VALIDATION_ERROR, UNSUPPORTED_CONTRACT_VERSION] }
              message: { type: string }
              fields:
                type: array
                items:
                  type: object
                  properties:
                    path: { type: string }
                    message: { type: string }
                    code: { type: string }
    RateLimited:
      description: Acima do limite por IP/função (checkRateLimit)
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }

  schemas:
    AsaasWebhook:
      type: object
      required: [event]
      additionalProperties: false
      properties:
        event:
          type: string
          description: 'Ex.: PAYMENT_RECEIVED, PAYMENT_OVERDUE, TRANSFER_DONE'
        payment:
          type: object
          required: [id]
          properties:
            id: { type: string }
            status: { type: string }
        transfer:
          type: object
          properties:
            id: { type: string }
            status: { type: string }
            transactionReceiptUrl: { type: string }
        id:
          type: string
          description: Obrigatório no contrato v2 (idempotência)

    AsaasWebhookV2:
      allOf:
        - $ref: '#/components/schemas/AsaasWebhook'
        - type: object
          required: [id]

    BlingWebhook:
      type: object
      required: [event, data]
      additionalProperties: false
      properties:
        eventId:
          type: string
          description: Obrigatório no contrato v2 (idempotência)
        date: { type: string, format: date-time }
        version: { oneOf: [{ type: string }, { type: number }] }
        companyId: { oneOf: [{ type: string }, { type: number }] }
        event: { type: string }
        module: { type: string }
        data:
          type: object
          additionalProperties: true
        retries: { type: number }

    BlingWebhookV2:
      allOf:
        - $ref: '#/components/schemas/BlingWebhook'
        - type: object
          required: [eventId]

    Bitrix24Webhook:
      type: object
      required: [event, data]
      additionalProperties: false
      properties:
        event: { type: string }
        event_id:
          type: string
          description: Obrigatório no contrato v2 (idempotência)
        data:
          type: object
          required: [FIELDS]
          properties:
            FIELDS:
              type: object
              additionalProperties: true
        ts: { type: string }
        auth:
          type: object
          properties:
            domain: { type: string }
            client_endpoint: { type: string }
            server_endpoint: { type: string }
            member_id: { type: string }
            application_token: { type: string }

    Bitrix24WebhookV2:
      allOf:
        - $ref: '#/components/schemas/Bitrix24Webhook'
        - type: object
          required: [event_id]

    WhatsappWebhook:
      type: object
      required: [event, from]
      additionalProperties: false
      properties:
        event: { type: string }
        messageId:
          type: string
          description: Obrigatório no contrato v2 (idempotência)
        status: { type: string }
        from: { type: string }
        text: { type: string }

    WhatsappWebhookV2:
      allOf:
        - $ref: '#/components/schemas/WhatsappWebhook'
        - type: object
          required: [messageId]

    ScimUser:
      type: object
      required: [userName]
      properties:
        schemas:
          type: array
          items: { type: string }
        userName: { type: string, format: email }
        displayName: { type: string }
        externalId: { type: string }
        active: { type: boolean }
        name:
          type: object
          properties:
            givenName: { type: string }
            familyName: { type: string }
            formatted: { type: string }
