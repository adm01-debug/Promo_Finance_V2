version: 2
updates:
  - package-ecosystem: pip
    directory: /scripts/graphify
    schedule:
      interval: monthly
    labels:
      - dependencias
      - graphify
    open-pull-requests-limit: 2

  # Dependências npm/bun do frontend (raiz do projeto)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencias
      - npm
    open-pull-requests-limit: 10
    groups:
      production-deps:
        dependency-type: production
        update-types:
          - minor
          - patch
      dev-deps:
        dependency-type: development
        update-types:
          - minor
          - patch

  # Versões das GitHub Actions usadas nos workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencias
      - github-actions
    open-pull-requests-limit: 5
