version: 2
updates:
  - package-ecosystem: pip
    directory: /scripts/graphify
    schedule:
      interval: monthly
    labels:
      - dependencias
      - graphify
    open-pull-requests-limit: 2

  # Dependências npm/bun do frontend (raiz do projeto)
  # Ecosystem "bun": o lockfile é bun.lock — com "npm" o updater aborta em
  # todo run ("Dependabot's npm_and_yarn ecosystem cannot update bun.lock").
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencias
      - npm
    open-pull-requests-limit: 10
    # Sem groups por dependency-type: o ecossistema bun não suporta esse
    # critério (só bundler/composer/mix/maven/npm/pip) — ver dependabot
    # options reference.

  # Versões das GitHub Actions usadas nos workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencias
      - github-actions
    open-pull-requests-limit: 5
