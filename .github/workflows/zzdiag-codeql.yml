name: zzdiag-CodeQL Analysis

# Analisa o TypeScript/JavaScript com o mecanismo de análise semântica do
# GitHub. Detecta injection, path traversal, XSS e ~75 outras classes de
# vulnerabilidade que grep e ESLint não pegam.

on:
  push:
    branches:
      - 'claude/chore-diagnostico-actions-**'
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write  # publicar SARIF no Code Scanning
  actions: read            # obrigatório em repos privados para CodeQL completar

jobs:
  analyze:
    name: Analyze TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          # security-and-quality cobre as queries padrão de segurança + code quality
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:javascript-typescript
