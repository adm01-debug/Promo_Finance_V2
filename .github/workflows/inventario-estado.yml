# docs:
#   gatilho: agendado (segunda 09:41 UTC), push em main que toque rotas/menu/edges/types/scripts do inventário, PR que toque os scripts (só testes) e dispatch
#   prova: branch `inventario` com inventario/estado/{banco,rotas,edges}.json refeitos do banco oficial (somente leitura) e do código em main
#   falha: o job fica vermelho e a branch `inventario` mantém a última versão publicada
#   avisa: ninguém (a branch é a prova; `alertas` dentro de banco.json lista o que está fora do lugar)
# nao-e-bug:
#   - sem-publicacao: "nada mudou" significa que o conteúdo é igual ao publicado fora dos carimbos de data e da telemetria rolante do cron
#   - sem-token: sem o secret SUPABASE_ACCESS_TOKEN o job falha de propósito — sem ele não há estado real do banco para inventariar
name: Inventário do estado real (semanal)

# Refaz inventario/estado/ a partir de DUAS fontes, sem nada escrito à mão:
#   banco.json  ← scripts/inventario/banco.sql no banco oficial bwwbeyolnnzppeuhgkcd
#                 (Management API, POST /database/query/read-only) + GET /functions + .from() no código
#   rotas.json  ← src/App.tsx + menu lateral + fecho de imports de cada página
#   edges.json  ← supabase/functions/ (linhas, segredos lidos, quem invoca cada edge)
#
# Onde fica: branch `inventario` (gerada, com histórico; nunca abra PR dela). A main tem branch
# protection com 8 checks obrigatórios e um PR aberto com GITHUB_TOKEN não dispara workflow — por
# isso a entrega é a branch gerada, mesmo padrão já usado pelo contexto.yml. A Vercel não builda a
# branch (vercel.json próprio com ignoreCommand).
#
# Como ler (agente ou dono):
#   git fetch origin inventario && git show origin/inventario:inventario/estado/banco.json
#   ou MCP get_file(ref=inventario), ou
#   raw.githubusercontent.com/adm01-debug/Promo_Finance_V2/inventario/inventario/estado/rotas.json

on:
  schedule:
    - cron: '41 9 * * 1' # segunda 09:41 UTC (06:41 BRT): fora do minuto 0 e dos outros crons do repo
  push:
    branches: [main]
    paths:
      - 'src/App.tsx'
      - 'src/components/layout/sidebar/**'
      - 'src/integrations/supabase/types.ts'
      - 'supabase/functions/**'
      - 'scripts/inventario/**'
      - '.github/workflows/inventario-estado.yml'
  # Em PR roda só a suíte dos geradores: nada é publicado a partir de PR.
  pull_request:
    branches: [main]
    paths:
      - 'scripts/inventario/**'
      - '.github/workflows/inventario-estado.yml'
  workflow_dispatch:

concurrency:
  group: inventario-estado
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  INVENTARIO_BRANCH: inventario
  NODE_VERSION: '22'

jobs:
  testes:
    name: Testes dos geradores
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: node --test (funções puras do inventário)
        run: node --test scripts/inventario/inventario.unit.mjs

      - name: gerar-rotas.mjs roda no código atual (sem publicar)
        run: node scripts/inventario/gerar-rotas.mjs

  gerar:
    name: Refazer e publicar inventario/estado
    if: github.event_name != 'pull_request'
    needs: testes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # push na branch gerada `inventario`
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Sempre da main: um dispatch a partir de branch não integrada inventariaria código que
          # não está em produção.
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Instalar ripgrep (usado pelo gerar-repo.mjs)
        run: command -v rg || sudo apt-get install -y --no-install-recommends ripgrep

      - name: Inventário do banco oficial (somente leitura)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN ausente — sem ele não há estado real do banco para inventariar."
            exit 1
          fi
          node scripts/inventario/gerar-banco.mjs

      - name: Inventário do repositório (rotas e edge functions)
        run: |
          node scripts/inventario/gerar-rotas.mjs
          # < /dev/null: sem lista de tabelas no stdin o script só grava edges.json
          # (o uso de tabelas já sai em banco.json).
          node scripts/inventario/gerar-repo.mjs < /dev/null

      - name: Decidir se vale publicar
        id: mudou
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch --quiet --depth 1 "$REMOTE" "$INVENTARIO_BRANCH" 2>/dev/null; then
            git update-ref refs/inventario/publicado FETCH_HEAD
            valor="$(INVENTARIO_REF=refs/inventario/publicado node scripts/inventario/mudou-conteudo.mjs)"
          else
            echo "branch $INVENTARIO_BRANCH ainda não existe — primeira publicação."
            valor=true
          fi
          echo "valor=$valor" >> "$GITHUB_OUTPUT"
          if [ "$valor" != "true" ]; then
            echo "Inventário sem mudança de conteúdo (fora dos carimbos de data) — nada a publicar."
          fi

      - name: Publicar na branch gerada
        if: steps.mudou.outputs.valor == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_MAIN: ${{ github.sha }}
          HUSKY: '0'
        run: |
          PUB="${RUNNER_TEMP:?}/pub"
          git worktree remove --force "$PUB" 2>/dev/null || true
          rm -rf "${PUB:?}"; git worktree prune
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git rev-parse --verify -q refs/inventario/publicado >/dev/null; then
            git worktree add --quiet --detach "$PUB" refs/inventario/publicado
            ( cd "$PUB" && git checkout --quiet -B "$INVENTARIO_BRANCH" )
          else
            mkdir -p "$PUB"
            ( cd "$PUB" && git init --quiet -b "$INVENTARIO_BRANCH" )
          fi
          mkdir -p "$PUB/inventario/estado"
          cp -a inventario/estado/. "$PUB/inventario/estado/"
          cat > "$PUB/README.md" <<'MD'
          # Branch gerada: inventário do estado real

          `inventario/estado/` é refeito pelo workflow `inventario-estado.yml` da main, do banco
          oficial (somente leitura) e do código em main — não edite nem abra PR desta branch.

          | Arquivo | O que é | Fonte |
          | --- | --- | --- |
          | `banco.json` | tabelas, RLS, policies, triggers, linhas, cron, extensões, edges publicadas, órfãs e `alertas` | `scripts/inventario/banco.sql` no banco `bwwbeyolnnzppeuhgkcd` + `GET /functions` |
          | `rotas.json` | cada URL do front: arquivo, papéis, item de menu, hooks, edges, RPCs, tabelas e buckets | `src/App.tsx` + menu lateral + imports de cada página |
          | `edges.json` | cada edge function: linhas, segredos lidos e quem a invoca | `supabase/functions/` |

          Comece por `alertas` em `banco.json` e por `problemas` em `rotas.json`.
          MD
          # Sem isto a Vercel faria um preview deploy a cada push (ela lê o vercel.json do commit).
          cat > "$PUB/vercel.json" <<'JSON'
          { "ignoreCommand": "exit 0", "git": { "deploymentEnabled": { "inventario": false } } }
          JSON
          cd "$PUB"
          git config user.name 'inventario[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then echo "nada mudou nos arquivos publicados."; exit 0; fi
          git commit --quiet -m "chore(inventario): estado real @ main ${HEAD_MAIN:0:7} [skip ci]"
          git push --quiet "$REMOTE" "HEAD:refs/heads/${INVENTARIO_BRANCH}"
          echo "Publicado em $INVENTARIO_BRANCH: $(git rev-parse --short HEAD)"

      - name: Resumo
        if: always()
        env:
          PUBLICOU: ${{ steps.mudou.outputs.valor }}
        run: |
          {
            echo "### Inventário do estado real"
            for f in banco rotas edges; do
              if [ -f "inventario/estado/$f.json" ]; then
                echo "- \`$f.json\`: $(wc -c < "inventario/estado/$f.json") bytes"
              else
                echo "- \`$f.json\`: não gerado neste run"
              fi
            done
            if [ "${PUBLICOU:-}" = 'true' ]; then echo "- publicou: sim"; else echo "- publicou: não (sem mudança de conteúdo)"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload do inventário
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v4
        with:
          name: inventario-estado-${{ github.run_id }}
          path: inventario/estado/
          retention-days: 14
