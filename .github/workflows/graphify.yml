name: Graphify — mapas privados

on:
  push:
    # Etapa 98: reconstruir o mapa de conhecimento automaticamente após cada
    # merge em main. Sem esse trigger o grafo fica desatualizado até a próxima
    # PR que toque nesses paths — podendo ficar dias stale em semanas sem PR.
    branches: [main]
    paths:
      - 'scripts/graphify/**'
      - '.github/workflows/graphify.yml'
      - 'src/**'
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - 'package.json'
  pull_request:
    paths:
      - 'scripts/graphify/**'
      - '.github/workflows/graphify.yml'
      - 'src/**'
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - 'package.json'
  workflow_dispatch:

# Cancela a run anterior no mesmo PR/branch quando novo push chega —
# o grafo é reconstruído do zero a cada run, então runs intermediárias
# desperdiçam ~13 minutos de runner em paralelo (11 perfis × 1 min).
concurrency:
  group: graphify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validacoes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Testar filtros e simular falhas
        run: python3 -m unittest discover -s scripts/graphify -p 'test_*.py' -v
      - name: Instalar ferramenta de desenvolvimento fixada
        run: python3 -m pip install --require-hashes -r scripts/graphify/requirements-linux-py311.lock
      - name: Validar piloto AST sem segredos ou banco
        run: python3 scripts/graphify/run.py pilot
      - name: Inventariar migrations sem executar SQL
        run: python3 scripts/graphify/sql_inventory.py
      - name: Correlacionar referências literais sem banco
        run: python3 scripts/graphify/code_references.py
      - name: Inventariar Edge Functions sem executar handlers
        run: python3 scripts/graphify/edge_inventory.py
      - name: Calibrar qualidade, navegação e visualização offline
        run: python3 scripts/graphify/graph_quality.py --profile pilot
      # Não publicar corpus, grafos, logs de extração ou evidências como artifacts.

  perfis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        profile:
          - edge-runtime
          - domain-integrations
          - frontend-entry
          - frontend-routes
          - frontend-components
          - finance-contas-pagar
          - finance-contas-receber
          - finance-cobranca
          - finance-conciliacao
          - finance-contabilidade
          - finance-tributario
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Instalar ferramenta de desenvolvimento fixada
        run: python3 -m pip install --require-hashes -r scripts/graphify/requirements-linux-py311.lock
      - name: Construir mapa AST privado do perfil
        run: python3 scripts/graphify/run.py analyze --profile ${{ matrix.profile }}
      # Nenhuma saída é publicada: pode carregar nomes internos e linhas de código.
