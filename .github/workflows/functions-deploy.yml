          - whatsapp-webhook

permissions:
  contents: read

concurrency:
  group: deploy-edge-function-canonico
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy da função aprovada
    # Secrets de produção só podem ser materializados a partir da branch
    # protegida/canônica, nunca de uma ref enviada para revisão.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.VITE_SUPABASE_PROJECT_ID }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Preparar Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v1
        with:
          version: 2.22.6

      - name: Validar credenciais e contrato de implantação
        run: |
          set -euo pipefail
          bash scripts/ci/require-env.sh \
            --label "Deploy de Edge Function no canônico" \
            SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF
          python3 scripts/security/test-supabase-config.py
          bash scripts/security/test-functions-deploy.sh

      - name: Implantar somente a função aprovada
        env:
          FUNCTION_NAME: ${{ inputs.function_name }}
        run: |
          set -euo pipefail
          bash scripts/migrate-functions.sh --only "$FUNCTION_NAME"

      - name: Registrar evidência do deploy
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: deploy-edge-function-log
          path: /tmp/deploy-log-*.jsonl
          if-no-files-found: warn
          retention-days: 30
