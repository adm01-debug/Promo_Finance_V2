# docs:
#   gatilho: push em main que toque código, banco, scripts das automações ou docs/contexto/regras/manual/; a cada 10 min (minuto 7); dispatch
#   prova: branch contexto com docs/contexto/{codigo,supabase,regras}/ regerados das três fontes de verdade (código em main, banco oficial bwwbeyolnnzppeuhgkcd, código+migrations+manual/) e docs/contexto/00-INDEX.md montado a partir dos manifests
#   falha: falha fatal de produtor reprova o workflow; fontes com artefato publicam e as demais mantêm a última versão
#   avisa: ninguém (a branch contexto é a prova; errors.md em supabase/ lista seções com falha)
# nao-e-bug:
#   - sem-commit: "nada mudou" no publicar significa que nenhuma das três fontes mudou desde a última publicação
#   - metricas: métricas/manifests do banco aguardam 60 min desde a coleta publicada; commits de código não reiniciam o prazo
#   - banco-pulado: sem o secret SUPABASE_DB_URL (ou PROD_DB_URL) o job do banco sai verde com aviso e a pasta supabase/ fica como estava
name: Contexto para agentes de IA (10 min)

# UM workflow, TRÊS produtores independentes (um job cada), UM índice, UMA branch:
# Falha fatal deixa o workflow vermelho; publicar ainda reúne as fontes disponíveis via !cancelled().
#
#   codigo/   ← scripts/ai-context/gerar.mjs   (rotas, módulos, hooks, edges, grafo, testes, convenções, baseline)
#   supabase/ ← scripts/supabase_snapshot/     (banco OFICIAL ao vivo: tabelas, RLS, funções, triggers, cron, lints)
#   regras/   ← scripts/regras_negocio/        (regras de negócio: RLS por operação, estados, validações, fórmulas, lacunas, manual/)
#   00-INDEX.md ← scripts/regras_negocio/indice.py (lê o manifest.json de cada pasta; diz quem é dono de cada fato)
#
# Cada fato tem um dono: schema real = supabase/; onde fica o código = codigo/; o que pode/não pode = regras/.
# Onde fica: branch `contexto` (gerada, com histórico; nunca abra PR dela). A main tem branch protection
# (push direto = GH006) e um PR a cada 10 min dispararia o CI inteiro. Push com GITHUB_TOKEN não dispara
# outros workflows (anti-loop). A Vercel não builda a branch (vercel.json próprio com ignoreCommand).
# Como ler: git fetch origin contexto && git show origin/contexto:docs/contexto/00-INDEX.md, ou MCP
# get_file(ref=contexto), ou raw.githubusercontent.com/adm01-debug/Promo_Finance_V2/contexto/docs/contexto/00-INDEX.md.
#
# Diferenças em relação ao Zapp_Web_V2 (origem do desenho):
#   - sem passo `graphify update .` — AGENTS.md §8 deste repo proíbe; grafo-graphify.json sai vazio.
#   - SUPABASE_DB_URL aceita o secret PROD_DB_URL como alternativa (nome já usado por prod-migrate.yml).
#   - guard de project-ref: a URL do banco precisa apontar para bwwbeyolnnzppeuhgkcd.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'supabase/**'
      - 'e2e/**'
      - 'scripts/ai-context/**'
      - 'scripts/regras_negocio/**'
      - 'scripts/supabase_snapshot/**'
      - 'docs/contexto/regras/manual/**'
      - 'package.json'
      - 'tsconfig*.json'
      - '.env.example'
      - '.github/workflows/**'
  # Em PR roda só a suíte dos produtores (job `testes`): os geradores não publicam de PR.
  pull_request:
    branches: [main]
    paths:
      - 'scripts/ai-context/**'
      - 'scripts/regras_negocio/**'
      - 'scripts/supabase_snapshot/**'
      - '.github/workflows/contexto.yml'
  schedule:
    - cron: '7-59/10 * * * *' # minuto 7: fora do minuto 0 (fila do GitHub) e dos outros crons do repo
  workflow_dispatch:
    inputs:
      force:
        description: 'Regenerar tudo ignorando o estado anterior da branch'
        type: boolean
        default: false

concurrency:
  group: contexto
  cancel-in-progress: false # push em main nunca é cancelado; o gate por commit evita trabalho repetido

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  CONTEXTO_BRANCH: contexto
  CONTEXTO_DIR: docs/contexto

jobs:
  testes:
    name: Suíte dos três produtores
    # Único job que roda em PR: protege os geradores contra regressão antes do merge.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Dependências Python (snapshot.py usa psycopg)
        run: |
          python3 -m pip install --quiet --break-system-packages --only-binary :all: -r scripts/supabase_snapshot/requirements.txt

      - name: Gerador de código (unitários + cenários sintéticos)
        run: |
          node --test scripts/ai-context/gerar.unit.mjs
          node scripts/ai-context/cenarios.mjs

      - name: Snapshot do banco (offline, sem conexão real)
        run: python3 scripts/supabase_snapshot/test_snapshot.py

      - name: Regras de negócio
        run: python3 scripts/regras_negocio/test_generate.py

  gate:
    name: O que precisa rodar
    # O dispatch não deve executar código de uma ref arbitrária com token de escrita.
    # Em pull_request nada é gerado nem publicado: só o job `testes` roda.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      codigo: ${{ steps.g.outputs.codigo }}
      regras: ${{ steps.g.outputs.regras }}
      banco: ${{ steps.g.outputs.banco }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Comparar HEAD de main com os manifests da branch contexto
        id: g
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE: ${{ inputs.force }}
        run: |
          head="$(git rev-parse HEAD)"
          last_codigo=""; last_regras=""
          if git fetch -q --depth=1 origin "$CONTEXTO_BRANCH" 2>/dev/null; then
            last_codigo="$(git show "FETCH_HEAD:$CONTEXTO_DIR/codigo/manifest.json" 2>/dev/null | python3 -c 'import json,sys; print(json.load(sys.stdin).get("commit",""))' 2>/dev/null || echo "")"
            last_regras="$(git show "FETCH_HEAD:$CONTEXTO_DIR/regras/manifest.json" 2>/dev/null | python3 -c 'import json,sys; print(json.load(sys.stdin).get("commit",""))' 2>/dev/null || echo "")"
          fi
          codigo=true; regras=true
          if [ "$EVENT_NAME" = "schedule" ] && [ "$FORCE" != "true" ]; then
            [ "$head" = "$last_codigo" ] && codigo=false
            [ "$head" = "$last_regras" ] && regras=false
          fi
          # banco muda sem push: coleta no agendamento e no dispatch, nunca no push
          banco=true; [ "$EVENT_NAME" = "push" ] && banco=false
          {
            echo "codigo=$codigo"
            echo "regras=$regras"
            echo "banco=$banco"
          } >> "$GITHUB_OUTPUT"
          echo "head=$head codigo=$codigo (último $last_codigo) regras=$regras (último $last_regras) banco=$banco"

  codigo:
    name: Produtor codigo/ (gerar.mjs)
    needs: gate
    if: needs.gate.outputs.codigo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 300 # baseline.json usa git log dos últimos 90 dias

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Testar o gerador
        run: node --test scripts/ai-context/gerar.unit.mjs

      - name: Gerar codigo/
        run: |
          node scripts/ai-context/gerar.mjs --out "$CONTEXTO_DIR/codigo"
          ls "$CONTEXTO_DIR/codigo"

      - name: Guardar para o publicar
        id: upload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v4
        with:
          name: contexto-codigo
          path: docs/contexto/codigo
          if-no-files-found: error
          retention-days: 1

  banco:
    name: Produtor supabase/ (snapshot.py)
    needs: gate
    if: needs.gate.outputs.banco == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # SUPABASE_DB_PASSWORD vive no environment Production (sem required reviewers).
    environment: Production
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    env:
      SNAPSHOT_DIR: docs/contexto/supabase
      # schema.sql exigiria pg_dump 17 (o runner tem o client 16); types.ts já vem do schema-drift.yml.
      PGDUMP: 'false'
      GEN_TYPES: 'false'
      PROJECT_REF: bwwbeyolnnzppeuhgkcd
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Dependências Python
        run: |
          python3 -m pip install --quiet --break-system-packages --only-binary :all: -r scripts/supabase_snapshot/requirements.txt

      - name: Recuperar snapshot anterior da branch contexto (CHANGELOG precisa do estado anterior)
        env:
          FORCE: ${{ inputs.force }}
        run: |
          mkdir -p "$SNAPSHOT_DIR"
          if git fetch --quiet --depth 1 origin "$CONTEXTO_BRANCH" 2>/dev/null; then
            git archive FETCH_HEAD -- "$SNAPSHOT_DIR" 2>/dev/null | tar -x || echo "::warning::branch existe mas sem $SNAPSHOT_DIR — recomeçando do zero"
          else
            echo "Branch $CONTEXTO_BRANCH ainda não existe: primeira coleta."
          fi
          if [ "$FORCE" = "true" ] && [ -f "$SNAPSHOT_DIR/snapshot.json" ]; then
            python3 - "$SNAPSHOT_DIR" <<'PY'
          import json
          import pathlib
          import sys

          output = pathlib.Path(sys.argv[1])
          snapshot = output / "snapshot.json"
          data = json.loads(snapshot.read_text(encoding="utf-8"))
          if not (
              isinstance(data, dict)
              and data.get("format_version") == 2
              and isinstance(data.get("db"), dict)
              and isinstance(data.get("api"), dict)
          ):
              raise SystemExit("snapshot anterior inválido; regeneração forçada recusada")
          (output / ".supabase-snapshot-output").write_text("supabase-snapshot-v2\n", encoding="utf-8")
          snapshot.unlink()
          PY
          fi

      - name: Montar o DSN do banco oficial
        # Ordem: secret pronto (SUPABASE_DB_URL/PROD_DB_URL); senão compõe com SUPABASE_DB_PASSWORD
        # + host do session pooler lido da própria Management API — nenhuma região fica chumbada.
        # Nada é impresso: o DSN é mascarado antes de ir para o GITHUB_ENV.
        env:
          DB_URL_SECRET: ${{ secrets.SUPABASE_DB_URL || secrets.PROD_DB_URL }}
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          publicar_dsn() {
            echo "::add-mask::$1"
            printf 'SNAPSHOT_DSN=%s\n' "$1" >> "$GITHUB_ENV"
            printf 'DSN_ORIGEM=%s\n' "$2" >> "$GITHUB_ENV"
            echo "DSN de origem: $2"
          }
          if [ -n "${DB_URL_SECRET:-}" ]; then
            publicar_dsn "$DB_URL_SECRET" secret
            exit 0
          fi
          if [ -z "${DB_PASSWORD:-}" ] || [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::warning::Sem SUPABASE_DB_URL/PROD_DB_URL e sem SUPABASE_DB_PASSWORD+SUPABASE_ACCESS_TOKEN — snapshot pulado (ver scripts/supabase_snapshot/README.md)"
            exit 0
          fi
          resposta="$(curl -sS --max-time 30 -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H 'User-Agent: contexto-workflow/1' \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/config/database/pooler" || true)"
          if [ -z "$resposta" ]; then
            echo "::warning::Management API não respondeu o pooler — snapshot pulado neste run"
            exit 0
          fi
          # Session pooler (porta 5432): o transaction pooler não serve para introspecção.
          alvo="$(RESPOSTA="$resposta" python3 -c '
          import json, os, sys
          try:
              dados = json.loads(os.environ["RESPOSTA"])
          except Exception:
              sys.exit(0)
          entradas = dados if isinstance(dados, list) else [dados]
          for entrada in entradas:
              if not isinstance(entrada, dict):
                  continue
              host = entrada.get("db_host")
              usuario = entrada.get("db_user") or entrada.get("db_user_name")
              if host and usuario:
                  print(f"{usuario}@{host}")
                  break
          ')"
          if [ -z "$alvo" ]; then
            echo "::warning::Resposta do pooler sem db_host/db_user — snapshot pulado neste run"
            exit 0
          fi
          senha="$(DB_PASSWORD="$DB_PASSWORD" python3 -c '
          import os, urllib.parse
          print(urllib.parse.quote(os.environ["DB_PASSWORD"], safe=""))
          ')"
          echo "::add-mask::$senha"
          publicar_dsn "postgresql://${alvo%@*}:${senha}@${alvo#*@}:5432/postgres?sslmode=require" pooler-composto

      - name: Gerar supabase/
        env:
          SUPABASE_DB_URL: ${{ env.SNAPSHOT_DSN }}
          # snapshot.py lê estes dois nomes para habilitar a Management API (edge functions,
          # auth/PostgREST, backups, rede, SSL, health). Sem eles essas seções saem vazias.
          SUPABASE_PROJECT_REF: ${{ env.PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          EVENTO: ${{ github.event_name }}
        run: |
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            # Sem DSN não há o que coletar. No agendamento sai verde com aviso para não pintar
            # 144 runs/dia de vermelho; no dispatch manual falha para a pessoa ver.
            echo "::warning::Nenhum DSN disponível — snapshot pulado (ver scripts/supabase_snapshot/README.md)"
            echo "SNAPSHOT_SKIPPED=1" >> "$GITHUB_ENV"
            if [ "$EVENTO" = "workflow_dispatch" ]; then exit 1; fi
            exit 0
          fi
          # Defesa em profundidade: só o banco OFICIAL pode ser introspeccionado aqui.
          case "$SUPABASE_DB_URL" in
            *"$PROJECT_REF"*) ;;
            *) echo "::error::A URL do banco não pertence ao project-ref $PROJECT_REF"; exit 1 ;;
          esac
          if python3 scripts/supabase_snapshot/snapshot.py; then
            exit 0
          fi
          # DSN composto por nós pode estar errado (host/porta/senha). Nesse caso o agendamento
          # avisa em vez de ficar vermelho a cada 10 min; com DSN vindo de secret, falha é falha.
          if [ "${DSN_ORIGEM:-}" = "pooler-composto" ] && [ "$EVENTO" != "workflow_dispatch" ]; then
            echo "::warning::snapshot.py falhou com o DSN composto do pooler — snapshot pulado neste run"
            echo "SNAPSHOT_SKIPPED=1" >> "$GITHUB_ENV"
            exit 0
          fi
          exit 1

      - name: Guard — nenhum segredo na saída
        if: env.SNAPSHOT_SKIPPED != '1'
        run: |
          if grep -rIEl 'eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}|sb_(secret|publishable)_[A-Za-z0-9_-]{8,}|postgres(ql)?://[^ ]*:[^ @]+@' "$SNAPSHOT_DIR"; then
            echo "::error::Possível segredo detectado no snapshot — publicação abortada"; exit 1
          fi

      - name: Reportar seções com erro (não falha o job)
        if: always() && env.SNAPSHOT_SKIPPED != '1'
        run: |
          if [ -f "$SNAPSHOT_DIR/errors.md" ] && ! grep -q '_nenhum_' "$SNAPSHOT_DIR/errors.md"; then
            echo "::warning::Algumas seções falharam — veja $SNAPSHOT_DIR/errors.md na branch $CONTEXTO_BRANCH"
            cat "$SNAPSHOT_DIR/errors.md"
          fi

      - name: Guardar para o publicar
        if: env.SNAPSHOT_SKIPPED != '1'
        id: upload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v4
        with:
          name: contexto-supabase
          path: docs/contexto/supabase
          if-no-files-found: error
          retention-days: 1

  regras:
    name: Produtor regras/ (generate.py)
    needs: gate
    if: needs.gate.outputs.regras == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 60 # o último commit não-bot vira o `commit` do manifest

      - name: Gerar regras/
        run: |
          python3 scripts/regras_negocio/generate.py --repo . --out "$CONTEXTO_DIR/regras" \
            --profile regras --schema-snapshot "$CONTEXTO_DIR/supabase" --index-path "$CONTEXTO_DIR/00-INDEX.md" --no-pointer
          ls "$CONTEXTO_DIR/regras"

      - name: Guardar para o publicar
        id: upload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v4
        with:
          name: contexto-regras
          path: docs/contexto/regras
          if-no-files-found: error
          retention-days: 1

  publicar:
    name: Índice único + branch contexto
    needs: [gate, codigo, banco, regras]
    # roda mesmo com produtor pulado ou vermelho: publica o que saiu e mantém o resto como estava
    if: ${{ !cancelled() && needs.gate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: # zizmor: ignore[excessive-permissions]
      contents: write # push na branch gerada contexto
    steps:
      - name: Checkout (main — indice.py e manual/ vêm daqui)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 1

      # Com um único artefato, a action extrai diretamente em path. Cada fonte tem destino explícito.
      - name: Baixar codigo/
        if: needs.codigo.outputs.artifact-id != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: contexto-codigo
          path: ${{ runner.temp }}/art/contexto-codigo

      - name: Baixar supabase/
        if: needs.banco.outputs.artifact-id != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: contexto-supabase
          path: ${{ runner.temp }}/art/contexto-supabase

      - name: Baixar regras/
        if: needs.regras.outputs.artifact-id != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: contexto-regras
          path: ${{ runner.temp }}/art/contexto-regras

      - name: Montar a branch e publicar (só se algo mudou)
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_MAIN: ${{ github.sha }}
          VOLATILE_MIN_INTERVAL_MIN: '60'
          HUSKY: '0'
        run: |
          ART="${RUNNER_TEMP:?}/art"
          PUB="${RUNNER_TEMP:?}/pub"
          git worktree remove --force "$PUB" 2>/dev/null || true
          rm -rf "${PUB:?}"; git worktree prune
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch --quiet --depth 1 origin "$CONTEXTO_BRANCH" 2>/dev/null; then
            git worktree add --quiet --detach "$PUB" FETCH_HEAD
            ( cd "$PUB" && git checkout --quiet -B "$CONTEXTO_BRANCH" )
          else
            mkdir -p "$PUB"
            ( cd "$PUB" && git init --quiet -b "$CONTEXTO_BRANCH" )
          fi
          mkdir -p "$PUB/$CONTEXTO_DIR"
          novos=0
          for fonte in codigo supabase regras; do
            if [ -d "$ART/contexto-$fonte" ]; then
              rm -rf "${PUB:?}/${CONTEXTO_DIR:?}/$fonte"
              cp -a "$ART/contexto-$fonte" "$PUB/$CONTEXTO_DIR/$fonte"
              novos=$((novos + 1))
            else
              echo "$fonte/: sem artefato neste run — mantém o que está na branch"
            fi
          done
          # manual/ é texto humano e vive em main: a cópia na branch segue a main
          if [ -d "$CONTEXTO_DIR/regras/manual" ]; then
            rm -rf "${PUB:?}/${CONTEXTO_DIR:?}/regras/manual"; mkdir -p "$PUB/$CONTEXTO_DIR/regras"
            cp -a "$CONTEXTO_DIR/regras/manual" "$PUB/$CONTEXTO_DIR/regras/manual"
          fi
          python3 scripts/regras_negocio/indice.py --repo "$PUB" --out "$CONTEXTO_DIR/00-INDEX.md" --head "$HEAD_MAIN" \
            --remote "$GITHUB_REPOSITORY" \
            --fonte "banco real=$CONTEXTO_DIR/supabase" \
            --fonte "código=$CONTEXTO_DIR/codigo" \
            --fonte "regras de negócio=$CONTEXTO_DIR/regras"
          cat > "$PUB/README.md" <<'EOF'
          # Branch gerada: contexto para agentes de IA

          Comece por `docs/contexto/00-INDEX.md`. Pastas `codigo/`, `supabase/` e `regras/` são regeradas a cada
          10 min pelo workflow `contexto.yml` da main — não edite nem abra PR desta branch. Regras humanas vivem
          em `docs/contexto/regras/manual/` na **main**.
          EOF
          # Sem isto a Vercel faria um preview deploy a cada push (a Vercel lê o vercel.json do commit deployado).
          cat > "$PUB/vercel.json" <<'EOF'
          { "ignoreCommand": "exit 0", "git": { "deploymentEnabled": { "contexto": false } } }
          EOF
          cd "$PUB"
          git config user.name 'contexto[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then echo "nada mudou em nenhuma das fontes."; exit 0; fi
          # Falha, recuperação e estado do índice são publicados imediatamente; só métricas aguardam.
          STRUCTURAL=$(git diff --cached --name-only | grep -vE '(/stats\.md|/stats\.json|/cron-runs\.md|/manifest\.json|/baseline\.json)$' || true)
          if [ -z "$STRUCTURAL" ] && git rev-parse --verify -q HEAD >/dev/null; then
            if [ -d "$ART/contexto-supabase" ]; then
              # HEAD contém o manifest já publicado, mesmo no checkout raso e após commits só de código.
              LAST=$(git show "HEAD:$CONTEXTO_DIR/supabase/manifest.json" 2>/dev/null | python3 -c '
          import json, sys
          from datetime import datetime, timezone
          try:
              stamp = json.load(sys.stdin).get("gerado_em", "")
              value = datetime.fromisoformat(stamp.replace("Z", "+00:00"))
              timestamp = int(value.timestamp())
              now = int(datetime.now(timezone.utc).timestamp())
              print(timestamp if value.tzinfo is not None and 0 < timestamp <= now else 0)
          except Exception:
              print(0)
          ') || LAST=0
              if [ "$LAST" -eq 0 ]; then
                echo "Não foi possível validar a data bancária publicada — publicando sem esperar."
              fi
            else
              LAST=$(git log -1 --format=%ct)
            fi
            AGE_MIN=$(( ( $(date +%s) - LAST ) / 60 ))
            if [ "$AGE_MIN" -lt "$VOLATILE_MIN_INTERVAL_MIN" ]; then
              echo "Só métricas/manifests mudaram (referência publicada há ${AGE_MIN} min) — aguardando."; exit 0
            fi
          fi
          git commit --quiet -m "chore(contexto): $novos fonte(s) regerada(s) @ main ${HEAD_MAIN:0:7} [skip ci]"
          git push --quiet "$REMOTE" "HEAD:refs/heads/$CONTEXTO_BRANCH"
          echo "Publicado em $CONTEXTO_BRANCH: $(git rev-parse --short HEAD) (fontes novas: $novos)"
