name: staging-migrate

on:
  workflow_dispatch:
    inputs:
      refresh_baseline:
        description: "Regerar baselines a partir de PROD antes de rodar"
        type: boolean
        default: false
      only_integrity:
        description: "Pular schema/functions/crons e rodar apenas testes"
        type: boolean
        default: false
      dry_run:
        description: "Executar em modo dry-run (sem escrever em staging)"
        type: boolean
        default: false

concurrency:
  group: staging-migrate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROD_DB_URL: ${{ secrets.PROD_DB_URL }}
      STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
      STAGING_PROJECT_REF: ${{ secrets.STAGING_PROJECT_REF }}
      STAGING_ANON_KEY: ${{ secrets.STAGING_ANON_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      TEST_ADMIN_JWT: ${{ secrets.TEST_ADMIN_JWT }}
      REQUIRED_SECRETS: ${{ vars.REQUIRED_SECRETS }}
      PROD_PROJECT_REF: ${{ vars.PROD_PROJECT_REF }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Instalar utilitários
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client jq gettext-base curl

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v1
        with:
          version: 2.22.6

      - name: bun install
        run: bun install --frozen-lockfile

      - name: Preparar flags
        id: flags
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          REFRESH_BASELINE: ${{ inputs.refresh_baseline }}
          ONLY_INTEGRITY: ${{ inputs.only_integrity }}
        run: |
          FLAGS=""
          if [ "$DRY_RUN" = "true" ]; then FLAGS="$FLAGS --dry-run"; fi
          if [ "$REFRESH_BASELINE" != "true" ]; then FLAGS="$FLAGS --skip-baseline"; fi
          if [ "$ONLY_INTEGRITY" = "true" ]; then FLAGS="$FLAGS --only-integrity"; fi
          echo "flags=$FLAGS" >> "$GITHUB_OUTPUT"

      - name: Executar staging-migrate
        env:
          STAGING_FLAGS: ${{ steps.flags.outputs.flags }}
        run: |
          # shellcheck disable=SC2086
          bash scripts/staging-migrate.sh $STAGING_FLAGS

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: staging-migrate-logs
          path: |
            /tmp/staging-migrate-*.jsonl
            /tmp/integrity-*.jsonl
          retention-days: 30
