name: staging-migrate

on:
  workflow_dispatch:
    inputs:
      refresh_baseline:
        description: "Regerar baselines a partir de PROD antes de rodar"
        type: boolean
        default: false
      only_integrity:
        description: "Pular schema/functions/crons e rodar apenas testes"
        type: boolean
        default: false
      dry_run:
        description: "Executar em modo dry-run (sem escrever em staging)"
        type: boolean
        default: false

concurrency:
  group: staging-migrate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Guard de pré-requisito: sucede (com aviso) quando os secrets não estão
  # configurados, evitando um failure permanente na página de Actions.
  # O job migrate só roda quando todos os secrets necessários estão presentes.
  check-secrets:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Verificar secrets obrigatórios
        id: check
        env:
          HAS_STAGING_DB_URL: ${{ secrets.STAGING_DB_URL != '' }}
          HAS_PROD_DB_URL: ${{ secrets.PROD_DB_URL != '' }}
          HAS_STAGING_PROJECT_REF: ${{ secrets.STAGING_PROJECT_REF != '' }}
          HAS_STAGING_ANON_KEY: ${{ secrets.STAGING_ANON_KEY != '' }}
          HAS_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
        run: |
          MISSING=()
          [ "$HAS_STAGING_DB_URL" = "false" ]         && MISSING+=("STAGING_DB_URL")
          [ "$HAS_PROD_DB_URL" = "false" ]            && MISSING+=("PROD_DB_URL")
          [ "$HAS_STAGING_PROJECT_REF" = "false" ]    && MISSING+=("STAGING_PROJECT_REF")
          [ "$HAS_STAGING_ANON_KEY" = "false" ]       && MISSING+=("STAGING_ANON_KEY")
          [ "$HAS_SUPABASE_ACCESS_TOKEN" = "false" ]  && MISSING+=("SUPABASE_ACCESS_TOKEN")
          # TEST_ADMIN_JWT é opcional — scripts/staging-migrate.sh trata ausência
          # com testes marcados como 'unverified' em vez de falhar

          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::warning::Secrets ausentes: ${MISSING[*]}"
            echo "::warning::Configure os secrets em Settings → Secrets → Actions antes de rodar staging-migrate."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  migrate:
    needs: check-secrets
    if: needs.check-secrets.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROD_DB_URL: ${{ secrets.PROD_DB_URL }}
      STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
      STAGING_PROJECT_REF: ${{ secrets.STAGING_PROJECT_REF }}
      STAGING_ANON_KEY: ${{ secrets.STAGING_ANON_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      TEST_ADMIN_JWT: ${{ secrets.TEST_ADMIN_JWT }}
      REQUIRED_SECRETS: ${{ vars.REQUIRED_SECRETS }}
      PROD_PROJECT_REF: ${{ vars.PROD_PROJECT_REF }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Instalar utilitários
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client jq gettext-base curl

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.22.6

      - name: bun install
        run: bun install --frozen-lockfile

      - name: Preparar flags
        id: flags
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          REFRESH_BASELINE: ${{ inputs.refresh_baseline }}
          ONLY_INTEGRITY: ${{ inputs.only_integrity }}
        run: |
          FLAGS=""
          if [ "$DRY_RUN" = "true" ]; then FLAGS="$FLAGS --dry-run"; fi
          if [ "$REFRESH_BASELINE" != "true" ]; then FLAGS="$FLAGS --skip-baseline"; fi
          if [ "$ONLY_INTEGRITY" = "true" ]; then FLAGS="$FLAGS --only-integrity"; fi
          echo "flags=$FLAGS" >> "$GITHUB_OUTPUT"

      - name: Executar staging-migrate
        env:
          STAGING_FLAGS: ${{ steps.flags.outputs.flags }}
        run: |
          # shellcheck disable=SC2086
          bash scripts/staging-migrate.sh $STAGING_FLAGS

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: staging-migrate-logs
          path: |
            /tmp/staging-migrate-*.jsonl
            /tmp/integrity-*.jsonl
          retention-days: 30
