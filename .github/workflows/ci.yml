name: CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  quality-gate:
    name: Quality Gate & Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Lint check
        run: bun run lint

      - name: Type check
        run: bun run type-check

      - name: Unit & Integration Tests
        run: bun run test:run

      - name: Coverage check
        run: bun run test:coverage

      - name: Build check
        run: bun run build

      - name: Install Playwright Browsers
        run: bunx playwright install --with-deps

      - name: E2E Tests
        run: bun run test:e2e
        env:
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Trigger Simulation Audit
        if: github.ref == 'refs/heads/main'
        run: |
          curl -X POST "${{ secrets.SUPABASE_URL }}/functions/v1/webhook-simulator" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
          -H "Content-Type: application/json" \
          -d '{"target_function": "asaas-webhook", "scenarios_count": 100, "mode": "stress"}'

      - name: Notify Failure
        if: failure()
        run: echo "CI Pipeline failed. Check the logs for details."
