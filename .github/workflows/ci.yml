name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ main ]

# Cancela runs anteriores do mesmo branch/PR para economizar minutos de runner.
# Em pushes para main usamos o SHA para nunca cancelar duas merges distintas.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'pr' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  secret-scan:
    name: Varredura de segredos (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write  # upload SARIF para o Code Scanning

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # A varredura cobre o histórico inteiro, não só o diff: força-push e
          # rebase podem trazer de volta um segredo já removido da ponta.
          fetch-depth: 0
          persist-credentials: false

      - name: Instalar gitleaks
        env:
          GITLEAKS_VERSAO: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          arquivo="gitleaks_${GITLEAKS_VERSAO}_linux_x64.tar.gz"
          curl -sSfL -o "$arquivo" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSAO}/${arquivo}"
          echo "${GITLEAKS_SHA256}  ${arquivo}" | sha256sum -c -
          sudo tar -xzf "$arquivo" -C /usr/local/bin gitleaks
          gitleaks version

      - name: Gate baseline só encolhe (etapa 49)
        # Impede que PRs adicionem novas entradas ao baseline — o baseline só
        # pode encolher (segredos remediados), nunca crescer (novos segredos
        # suprimidos). Um novo segredo real deve ser removido do código; um
        # falso positivo deve ser documentado como exceção com justificativa.
        # Compara o CONJUNTO de fingerprints (não a contagem) para detectar
        # substituição de entradas históricas por novas supressões.
        run: |
          set -euo pipefail
          # Fetch sem --depth: --depth=1 trunca a main local e quebra o
          # git merge-base do step de varredura (BASE vazio → varredura do
          # histórico inteiro → achados antigos fora do baseline).
          git fetch origin main 2>/dev/null || true
          if git show origin/main:.gitleaks-baseline.json >/dev/null 2>&1; then
            # Extrai e ordena fingerprints de ambas as versões
            jq -r '.[].Fingerprint' .gitleaks-baseline.json | sort > /tmp/pr_fps.txt
            git show origin/main:.gitleaks-baseline.json | jq -r '.[].Fingerprint' | sort > /tmp/main_fps.txt
            pr_count=$(wc -l < /tmp/pr_fps.txt)
            main_count=$(wc -l < /tmp/main_fps.txt)
            # Fingerprints na PR ausentes em main → nova supressão detectada
            comm -23 /tmp/pr_fps.txt /tmp/main_fps.txt > /tmp/new_fps.txt
            new_count=$(wc -l < /tmp/new_fps.txt)
            if [ "$new_count" -gt 0 ]; then
              echo "::error::Baseline tem ${new_count} nova(s) supressão(ões) ausentes em main (substituição detectada mesmo sem crescimento de contagem)."
              sed 's/^/  + /' /tmp/new_fps.txt
              echo "Remova o(s) segredo(s) do código; não os suprima no baseline."
              exit 1
            fi
            echo "Baseline: PR=${pr_count} entradas, main=${main_count} — conjunto PR ⊆ main — OK"
          else
            echo "Branch main sem baseline ainda — pulando comparação."
          fi

      - name: Varredura de segredos
        # --redact impede que um segredo recém-detectado seja impresso no log
        # público do build, que é exatamente onde ele não pode acabar.
        # O baseline carrega os achados históricos já tratados; qualquer
        # ocorrência nova reprova o job.
        # --log-opts escopa a varredura aos commits novos da PR (não ao
        # histórico inteiro do repo), evitando falsos positivos de commits
        # já presentes em main antes desta PR existir.
        run: |
          # HEAD é o merge ref do PR (refs/pull/N/merge): o 1º pai é a main na
          # época do merge — escopo determinístico que não depende do estado
          # local de origin/main.
          if git rev-parse --verify -q HEAD^2 >/dev/null 2>&1; then
            BASE=$(git rev-parse HEAD^1)
          elif [ "${{ github.event_name }}" = "push" ] && [ -n "${{ github.event.before }}" ]; then
            # Em push, origin/main já aponta para o HEAD novo: merge-base
            # devolve o próprio HEAD e `HEAD..HEAD` varreria zero commits.
            # O `before` do evento é o sha anterior de main — o escopo certo.
            BASE="${{ github.event.before }}"
          else
            BASE=$(git merge-base origin/main HEAD 2>/dev/null || echo "")
          fi
          if [ -n "$BASE" ]; then
            LOG_OPTS="${BASE}..HEAD"
          else
            LOG_OPTS="HEAD"
          fi
          gitleaks git \
            --no-banner \
            --redact \
            --log-opts="${LOG_OPTS}" \
            --baseline-path .gitleaks-baseline.json \
            --report-format sarif \
            --report-path gitleaks.sarif

      - name: Publicar SARIF no Code Scanning
        # Envia para GitHub Security → Code scanning alerts (sempre, mesmo sem achados)
        if: always()
        uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks
        continue-on-error: true  # não bloqueia se o sarif não foi gerado (baseline clean)

      - name: Publicar relatório
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          retention-days: 14

  quality-gate:
    name: Quality Gate & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # fetch-depth completo: o gate de formato precisa do merge-base
          # com a branch de destino da PR.
          fetch-depth: 0
          persist-credentials: false
      # Etapa 27: composite action elimina bloco bun+cache repetido 5x.
      - uses: ./.github/actions/setup-bun

      - name: Security scan
        # Bloqueante: vulnerabilidades conhecidas em dependências diretas
        # devem ser corrigidas antes do merge, não apenas registradas.
        # Em caso de falsa positivo documentado, use `bun audit --ignore`.
        # GHSA-vfj7-8cjw-p6xm (braces <=3.0.3): sem release corrigida —
        # 3.0.3 é a última publicada. Só entra via micromatch de
        # tailwindcss/lint-staged, ferramentas de build/dev cujos padrões
        # glob são os nossos, não input de usuário — DoS por padrão
        # aninhado não se aplica. Revisitar quando sair braces 3.0.4+.
        run: bun audit --ignore=GHSA-vfj7-8cjw-p6xm

      - name: External secret isolation guard
        # Impede que EXTERNAL_SUPABASE_SERVICE_ROLE_KEY seja lido fora da
        # Edge Function `external-data`. Ver docs/AUDITORIA_BACKEND_SENIOR.md.
        run: bash scripts/check-external-secret-isolation.sh

      - name: Zod coverage gate (edge functions)
        # Falha se novas funções chegarem sem validatePayload (Zod).
        run: bash scripts/security/zod-coverage.sh

      - name: Gate offline do banco canônico
        # Exercita os avaliadores com snapshots controlados. Não substitui a
        # verificação live executada pelo workflow Supabase Linter.
        run: node --test scripts/security/test-canonical-db-gates.test.mjs

      - name: Replay safety das migrations críticas
        # Impede a reintrodução de ALTER DATABASE privilegiado, delimitadores
        # SQL ambíguos e escrita manual no ledger de migrations.
        run: bash scripts/security/test-migration-replay-safety.sh

      - name: Integridade do Supabase config
        # O parser TOML detecta tabelas duplicadas; as asserções preservam os
        # contratos que fazem autenticação por segredo dentro da Edge Function.
        run: python3 scripts/security/test-supabase-config.py

      - name: Contrato de deploy das Edge Functions
        run: bash scripts/security/test-functions-deploy.sh

      - name: Gate estático do reparo SQL
        # Evita que a evidência do reparo dos 12 erros reais do linter passe com
        # falso positivo ou drift de ACL/assinatura fora do contrato revisado.
        run: node scripts/security/test-lint-function-repairs.mjs

      - name: Format check (arquivos alterados)
        # Gate incremental, no espírito do "baseline só encolhe": exige Prettier
        # nos arquivos alterados pela PR em vez de exigir a formatação global,
        # que ainda é dívida histórica. Assim a superfície formatada cresce
        # monotonicamente a cada PR sem um diff gigante de uma vez.
        run: |
          BASE=$(git merge-base origin/main HEAD)
          FILES=$(git diff --name-only --diff-filter=ACMR "$BASE" HEAD -- 'src/**/*.ts' 'src/**/*.tsx' 'src/**/*.css' 'src/**/*.json' 'supabase/functions/**/*.ts')
          if [ -n "$FILES" ]; then
            echo "$FILES" | xargs bunx prettier --check
          else
            echo "Nenhum arquivo formatável alterado — gate aprovado."
          fi

      - name: Lint check
        # Etapa 46: bloqueia erros de lint.
        run: bun run lint

      - name: Preflight dos gates com DATABASE_URL
        id: db_url_preflight
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          bash scripts/ci/require-env.sh \
            --label "Quality Gate — DATABASE_URL" \
            --mode summary \
            --output available \
            DATABASE_URL


      - name: Observability privileges guard (psql)
        # Falha o pipeline se alguma função SECURITY DEFINER de observabilidade
        # regredir privilégios EXECUTE para anon/PUBLIC/authenticated.
        # Requer secret DATABASE_URL apontando para o Postgres do Supabase.
        if: ${{ steps.db_url_preflight.outputs.available == 'true' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f scripts/security/test-observability-privileges.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f scripts/security/test-security-definer-invocation.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f supabase/tests/sql/rls_multi_empresa.sql

      - name: Integridade dos catálogos tributários (pgTAP)
        # Valida PK/UNIQUE, enums, formatos e ranges das tabelas fiscais
        # carregadas por seeds. Falha o build em qualquer "not ok".
        if: ${{ steps.db_url_preflight.outputs.available == 'true' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f supabase/tests/sql/catalogos_tributarios.test.sql 2>&1 | tee catalogos.tap
          if grep -q "not ok" catalogos.tap; then
            echo "::error::Catálogos tributários com invariantes violadas."
            grep "not ok" catalogos.tap
            exit 1
          fi
          echo "✅ Catálogos tributários íntegros."

      - name: Gate #35 — Governança de retenção de dados
        # Falha o build se alguma tabela de log/histórico/telemetria com coluna
        # temporal for criada sem política em public.retencao_politicas (TTL ou
        # isenção justificada), ou se uma política existente apontar para uma
        # coluna temporal inexistente.
        if: ${{ steps.db_url_preflight.outputs.available == 'true' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f scripts/integrity/14_retencao.sql 2>&1 | tee retencao.tsv
          if grep -qP '\tfail\t' retencao.tsv; then
            echo "::error::Gate #35 reprovado — tabela de log sem política de retenção."
            grep -P '\tfail\t' retencao.tsv
            exit 1
          fi
          echo "✅ Gate #35 aprovado."


      - name: Registrar gates de banco como inconclusivos sem DATABASE_URL
        if: ${{ steps.db_url_preflight.outputs.available != 'true' }}
        run: |
          {
            echo "### Gates dependentes de DATABASE_URL"
            echo
            echo "- Status: inconclusivo"
            echo "- Não executados nesta run: Observability privileges guard, Integridade dos catálogos tributários (pgTAP), Gate #35 — Governança de retenção."
            echo "- Motivo: secret \`DATABASE_URL\` ausente. Nenhum desses gates deve ser interpretado como aprovado."
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preflight do gate Runtime RPC
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
        run: |
          bash scripts/ci/require-env.sh \
            --label "Quality Gate — Runtime RPC" \
            SUPABASE_URL SUPABASE_ANON_KEY E2E_USER_EMAIL E2E_USER_PASSWORD

      - name: Runtime RPC privilege matrix (anon / authenticated)
        # Invoca cada RPC sensível via /rest/v1/rpc/<fn> como anon e usuário
        # autenticado. O papel service_role é validado apenas pelo gate SQL,
        # sem expor sua chave a um probe HTTP de produção.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          # Segredo compartilhado com a edge function ci-security-gate-log.
          # Quando presente, o script registra automaticamente cada falha em
          # public.ci_security_gate_events com git_sha e run URL.
          CI_GATE_LOG_SECRET: ${{ secrets.CI_GATE_LOG_SECRET }}
          MIGRATION_REVISION: ${{ github.sha }}
        run: bun run scripts/security/test-rpc-runtime.ts

      - name: Export function privileges snapshot (CSV + JSON)

        # Gera um resumo por função × role para inspeção e download no CI.
        # Não falha o build — o gate acima já cobre regressões.
        if: ${{ steps.db_url_preflight.outputs.available == 'true' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OUT_DIR: ./artifacts/security
        run: bash scripts/security/export-function-privileges.sh

      - name: Upload function privileges artifact
        if: ${{ steps.db_url_preflight.outputs.available == 'true' && always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: function-privileges
          path: artifacts/security/function-privileges.*
          if-no-files-found: warn
          retention-days: 30




      - name: Type check
        run: bun run type-check

      - name: Ratchet strictNullChecks (baseline só encolhe)
        # O tsconfig principal já roda strict global (PR #141); este gate
        # continua valendo como proteção contra regressão do overlay.
        run: bun run type-check:strict

      - name: Type check da infraestrutura de teste
        # `tsc --noEmit` cobre só `src/`. O Playwright transpila as specs com
        # esbuild, que apaga tipos sem verificá-los: um símbolo inexistente vira
        # `undefined` em silêncio e a asserção passa a comparar com nada. Com o
        # gate financeiro bloqueante, a fixture que o sustenta é código de
        # produção do CI.
        run: bun run type-check:e2e

      - name: Unit & Integration Tests
        # Etapa 61: reporter JUnit exporta XML para download/integração com
        # ferramentas de análise (SonarCloud, Codecov, dashboards de equipe).
        # O reporter verbose continua visível no log; o junit vai para arquivo.
        run: |
          mkdir -p test-results
          bun run test:run -- --reporter=verbose --reporter=junit --outputFile.junit=test-results/junit.xml

      - name: Publicar resultados JUnit
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: junit-test-results
          path: test-results/junit.xml
          retention-days: 30
          if-no-files-found: warn

      - name: Coverage check
        run: bun run test:coverage

      - name: Publicar cobertura como artefato
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30
          if-no-files-found: warn

      - name: Build check
        run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Gate de tamanho de bundle (etapa 50)
        # Impede regressão silenciosa de bundle: nenhum chunk JS individual
        # pode ultrapassar 600 KB (gzip off). Chunks grandes degradam LCP e
        # indicam import acidental de dep pesada. Ajuste o threshold em
        # THRESHOLD_KB abaixo se uma dep legítima exigir.
        run: |
          set -euo pipefail
          THRESHOLD_KB=600
          THRESHOLD_BYTES=$((THRESHOLD_KB * 1024))
          FAIL=0
          while IFS= read -r -d '' chunk; do
            size=$(stat -c%s "$chunk")
            name=$(basename "$chunk")
            if [ "$size" -gt "$THRESHOLD_BYTES" ]; then
              echo "::error::Chunk muito grande: $name ($((size / 1024)) KB > ${THRESHOLD_KB} KB)"
              FAIL=1
            else
              echo "  OK  $name  ($((size / 1024)) KB)"
            fi
          done < <(find dist/assets -name "*.js" -print0 2>/dev/null)
          [ "$FAIL" -eq 0 ] || exit 1
          echo "✅ Todos os chunks JS dentro do limite de ${THRESHOLD_KB} KB."

      - name: Gate env.manifest.json atualizado (etapa 48)
        # Garante que env.manifest.json reflita o estado atual das envs do código.
        # Se alguém adicionar/remover uma variável de ambiente e não rodar o
        # gerador, este gate reprova o CI. Execute: node scripts/generate-env-manifest.mjs
        run: |
          set -euo pipefail
          node scripts/generate-env-manifest.mjs --check 2>/dev/null || \
            node scripts/generate-env-manifest.mjs
          if ! git diff --exit-code env.manifest.json > /dev/null 2>&1; then
            echo "::error::env.manifest.json está desatualizado. Execute 'node scripts/generate-env-manifest.mjs' e commite o resultado."
            git diff env.manifest.json
            exit 1
          fi
          echo "✅ env.manifest.json atualizado."

      - name: Upload Error Logs
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ci-error-logs
          path: |
            test-results/
            playwright-report/
            coverage/
          retention-days: 7
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Gate E2E crítico: somente cenários que hoje provam as correções reais.
  # Nada aqui depende de storageState compartilhado ou de skips "verdes".
  # ---------------------------------------------------------------------------
  e2e-critical:
    name: E2E Critical Gate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/setup-playwright

      - name: Preflight E2E crítico
        env:
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
        run: |
          bash scripts/ci/require-env.sh \
            --label "E2E crítico" \
            E2E_USER_EMAIL E2E_USER_PASSWORD SUPABASE_URL SUPABASE_ANON_KEY VITE_SUPABASE_PROJECT_ID

      - name: E2E crítico obrigatório
        run: bunx playwright test -c playwright.critical.config.ts --project=chromium --reporter=list
        env:
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          CI: true

      - name: Publicar artefatos de falha E2E crítico (etapa 62)
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: e2e-critical-falhas
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Fluxo destrutivo de logout real — cenário único, isolado e bloqueante.
  # ---------------------------------------------------------------------------
  e2e-destructive:
    name: E2E Destructive Logout
    needs: [quality-gate, e2e-critical]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/setup-playwright

      - name: Preflight E2E destrutivo
        env:
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
        run: |
          bash scripts/ci/require-env.sh \
            --label "E2E destrutivo" \
            E2E_USER_EMAIL E2E_USER_PASSWORD SUPABASE_URL SUPABASE_ANON_KEY VITE_SUPABASE_PROJECT_ID

      - name: E2E Logout Destrutivo
        run: bunx playwright test -c playwright.destructive.config.ts --project=chromium-destructive --reporter=list
        env:
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          CI: true

      - name: Publicar artefatos de falha E2E destrutivo (etapa 62)
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: e2e-destructive-falhas
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Gate E2E financeiro: telas de dinheiro, 100% offline.
  #
  # Bloqueante e sem um único secret. As specs rodam contra um projeto Supabase
  # sintético e sessão semeada no browser (`e2e/fixtures/sessao.ts`), então não
  # há preflight `require-env.sh` a fazer: não existe variável cuja ausência
  # possa degradar o gate para verde-vazio. É o motivo de ele poder ser
  # bloqueante onde `e2e-critical` não poderia — inclusive em PR de fork, que
  # não recebe secrets.
  # ---------------------------------------------------------------------------
  e2e-financeiro:
    name: E2E Financeiro (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/setup-playwright

      - name: E2E financeiro obrigatório
        run: bunx playwright test --config=playwright.financeiro.config.ts --project=chromium --reporter=list
        env:
          CI: true

      - name: Publicar artefatos de falha
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: e2e-financeiro-falhas
          path: test-results/financeiro
          retention-days: 7
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Quarentena E2E legada: não bloqueante, 1 worker, sem claims de aprovação
  # de produção. O resultado é publicado no step summary do workflow.
  # ---------------------------------------------------------------------------
  e2e-quarantine:
    name: E2E Quarantine (non-blocking)
    if: ${{ always() }}
    needs: [quality-gate, e2e-critical, e2e-destructive, e2e-financeiro]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/setup-playwright

      - name: Montar lista da quarentena
        run: |
          set -euo pipefail
          # A lista é DERIVADA do `testMatch` dos configs bloqueantes, nunca
          # cravada aqui. Duas listas descrevendo a mesma cobertura divergem, e
          # a divergência perigosa é silenciosa: uma spec removida de um gate e
          # ainda excluída daqui para de rodar em qualquer job, sem sinal
          # vermelho. O script também falha se algum `testMatch` deixar de casar
          # arquivo — um gate verde que não testa nada.
          bun run scripts/ci/listar-specs-quarentena.ts > quarantine-specs.txt
          echo "count=$(wc -l < quarantine-specs.txt)" >> "$GITHUB_OUTPUT"
        id: quarantine_specs

      - name: Executar suíte legada em quarentena
        id: quarantine_run
        if: steps.quarantine_specs.outputs.count != '0'
        continue-on-error: true
        run: |
          set -euo pipefail
          mapfile -t quarantine_specs < quarantine-specs.txt
          bunx playwright test \
            --config=playwright.config.ts \
            --project=chromium \
            --workers=1 \
            --reporter=list \
            "${quarantine_specs[@]}"
        env:
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          ENABLE_AUTHENTICATED_VISUAL_SNAPSHOTS: ${{ vars.ENABLE_AUTHENTICATED_VISUAL_SNAPSHOTS }}
          CI: true

      - name: Publicar resumo da quarentena
        if: always()
        env:
          RESULT_QUALITY_GATE: ${{ needs.quality-gate.result }}
          RESULT_E2E_CRITICAL: ${{ needs.e2e-critical.result }}
          RESULT_E2E_DESTRUCTIVE: ${{ needs.e2e-destructive.result }}
          RESULT_E2E_FINANCEIRO: ${{ needs.e2e-financeiro.result }}
          QUARANTINE_SPECS_COUNT: ${{ steps.quarantine_specs.outputs.count }}
          QUARANTINE_RUN_OUTCOME: ${{ steps.quarantine_run.outcome }}
        run: |
          {
            echo "## E2E Quarantine"
            echo
            echo "- Natureza: não bloqueante"
            echo "- Resultado do quality-gate: $RESULT_QUALITY_GATE"
            echo "- Resultado do e2e-critical: $RESULT_E2E_CRITICAL"
            echo "- Resultado do e2e-destructive: $RESULT_E2E_DESTRUCTIVE"
            echo "- Resultado do e2e-financeiro: $RESULT_E2E_FINANCEIRO"
            echo "- Specs listadas: $QUARANTINE_SPECS_COUNT"
            if [ "$QUARANTINE_SPECS_COUNT" = "0" ]; then
              echo "- Resultado: nenhuma spec elegível para quarentena"
            else
              echo "- Resultado do step: $QUARANTINE_RUN_OUTCOME"
              echo
              echo "### Arquivos executados"
              sed 's/^/- `/' quarantine-specs.txt | sed 's/$/`/'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Auditoria pós-merge — só roda em main após os gates reais passarem.
  # ---------------------------------------------------------------------------
  post-merge-audit:
    name: Post-merge Simulation Audit
    # Stress em produção é mutável e deve ser opt-in, com a variável de
    # repositório explicitamente habilitada durante uma janela autorizada.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.ENABLE_PRODUCTION_SIMULATION_AUDIT == 'true'
    needs: [quality-gate, e2e-critical, e2e-destructive, e2e-financeiro]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Trigger Simulation Audit
        run: |
          curl -fsS -X POST "${{ secrets.SUPABASE_URL }}/functions/v1/webhook-simulator" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"target_function": "asaas-webhook", "scenarios_count": 100, "mode": "stress"}'
