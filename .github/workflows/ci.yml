name: CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ main, master, develop ]

jobs:
  quality-gate:
    name: Quality Gate & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.1.42"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Security scan
        run: bun audit || echo "::warning::bun audit reported vulnerabilities — see logs"

      - name: Lint check
        run: bun run lint

      - name: Type check
        run: bun run type-check

      - name: Unit & Integration Tests
        run: bun run test:run

      - name: Coverage check
        run: bun run test:coverage

      - name: Build check
        run: bun run build

      - name: Install Playwright Browsers
        run: bunx playwright install --with-deps

      - name: E2E Tests
        run: bun run test:e2e
        env:
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          CI: true

      - name: Upload Test Artifacts (Reports & Screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 30

      - name: Upload Error Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-error-logs
          path: "*.log"
          retention-days: 7

      - name: Trigger Simulation Audit
        if: github.ref == 'refs/heads/main' && success()
        run: |
          curl -X POST "${{ secrets.SUPABASE_URL }}/functions/v1/webhook-simulator" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
          -H "Content-Type: application/json" \
          -d '{"target_function": "asaas-webhook", "scenarios_count": 100, "mode": "stress"}'

      - name: Notify Failure
        if: failure()
        run: |
          echo "CI Pipeline failed. Check the logs and Playwright report for details."
          exit 1
