name: CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ main, master, develop ]

jobs:
  quality-gate:
    name: Quality Gate & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # bun.lock usa o formato de texto (lockfileVersion/configVersion 1),
          # suportado a partir do Bun 1.2+. A versão 1.1.42 falhava com
          # "Unknown lockfile version" no install --frozen-lockfile.
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Security scan
        run: bun audit || echo "::warning::bun audit reported vulnerabilities — see logs"

      - name: External secret isolation guard
        # Impede que EXTERNAL_SUPABASE_SERVICE_ROLE_KEY seja lido fora da
        # Edge Function `external-data`. Ver docs/AUDITORIA_BACKEND_SENIOR.md.
        run: bash scripts/check-external-secret-isolation.sh

      - name: Zod coverage gate (edge functions)
        # Falha se novas funções chegarem sem validatePayload (Zod).
        run: bash scripts/security/zod-coverage.sh

      - name: Lint check
        run: bun run lint


      - name: Observability privileges guard (psql)
        # Falha o pipeline se alguma função SECURITY DEFINER de observabilidade
        # regredir privilégios EXECUTE para anon/PUBLIC/authenticated.
        # Requer secret DATABASE_URL apontando para o Postgres do Supabase.
        if: ${{ env.DATABASE_URL != '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f scripts/security/test-observability-privileges.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f scripts/security/test-security-definer-invocation.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f supabase/tests/sql/rls_multi_empresa.sql

      - name: Privilege baseline gate (allowlist global + RLS + cofres)
        # Falha o pipeline se QUALQUER função SECURITY DEFINER passar a ser
        # executável por anon/authenticated fora do allowlist justificado,
        # se alguma tabela de public perder RLS, ou se um cofre de credenciais
        # (tokens OAuth, chaves de API, certificados) receber GRANT indevido.
        if: ${{ env.DATABASE_URL != '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f scripts/security/test-privilege-baseline.sql

      - name: Tenant isolation gate (probe de runtime como authenticated)
        # Assume o papel `authenticated` com JWT sintético de um usuário sem
        # vínculo em user_empresas e sem papel, e varre todas as tabelas com
        # RLS: qualquer linha visível é vazamento cross-tenant e qualquer erro
        # dentro de policy vira 401 para o usuário final.
        if: ${{ env.DATABASE_URL != '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f scripts/security/test-tenant-isolation.sql




      - name: Integridade dos catálogos tributários (pgTAP)
        # Valida PK/UNIQUE, enums, formatos e ranges das tabelas fiscais
        # carregadas por seeds. Falha o build em qualquer "not ok".
        if: ${{ env.DATABASE_URL != '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f supabase/tests/sql/catalogos_tributarios.test.sql 2>&1 | tee catalogos.tap
          if grep -q "not ok" catalogos.tap; then
            echo "::error::Catálogos tributários com invariantes violadas."
            grep "not ok" catalogos.tap
            exit 1
          fi
          echo "✅ Catálogos tributários íntegros."


      - name: Runtime RPC privilege matrix (anon / authenticated / service_role)
        # Invoca cada RPC nfe_* e conciliacao_* via /rest/v1/rpc/<fn> com três
        # identidades reais e valida contra a matriz de exceções controladas.
        if: ${{ env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != '' && env.E2E_USER_EMAIL != '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          # Segredo compartilhado com a edge function ci-security-gate-log.
          # Quando presente, o script registra automaticamente cada falha em
          # public.ci_security_gate_events com git_sha e run URL.
          CI_GATE_LOG_SECRET: ${{ secrets.CI_GATE_LOG_SECRET }}
          MIGRATION_REVISION: ${{ github.sha }}
        run: bun run scripts/security/test-rpc-runtime.ts

      - name: Anonymous HTTP surface probe (RLS + grants)
        # Gap #25 — probe real com a identidade `anon` sobre tabelas sensíveis e
        # RPCs administrativas. Falha se houver vazamento de linhas, escrita
        # anônima aceita ou regressão de policy (401 onde deveria haver 200 []).
        if: ${{ env.SUPABASE_URL != '' && env.SUPABASE_ANON_KEY != '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          CI_GATE_LOG_SECRET: ${{ secrets.CI_GATE_LOG_SECRET }}
          MIGRATION_REVISION: ${{ github.sha }}
        run: bun run scripts/security/test-anon-surface.ts

      - name: Export function privileges snapshot (CSV + JSON)

        # Gera um resumo por função × role para inspeção e download no CI.
        # Não falha o build — o gate acima já cobre regressões.
        if: ${{ env.DATABASE_URL != '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OUT_DIR: ./artifacts/security
        run: bash scripts/security/export-function-privileges.sh

      - name: Upload function privileges artifact
        if: ${{ env.DATABASE_URL != '' && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: function-privileges
          path: artifacts/security/function-privileges.*
          if-no-files-found: warn
          retention-days: 30




      - name: Type check
        run: bun run type-check

      - name: Unit & Integration Tests
        run: bun run test:run

      - name: Coverage check
        run: bun run test:coverage

      - name: Build check
        run: bun run build

      - name: Upload Error Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-error-logs
          path: "*.log"
          retention-days: 7

  # ---------------------------------------------------------------------------
  # E2E — job separado, sharded, roda em paralelo ao quality-gate.
  # Configurado como required check no branch protection → bloqueia merge de PR
  # se qualquer shard falhar. Cada shard sobe seu próprio dev server via
  # `webServer` do playwright.config.ts.
  # ---------------------------------------------------------------------------
  e2e:
    name: E2E Tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      - name: E2E Tests (chromium, shard ${{ matrix.shard }}/3)
        run: bunx playwright test --project=chromium --shard=${{ matrix.shard }}/3 --reporter=blob
        env:
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          CI: true

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Merge blob reports em um HTML único para inspeção pós-run.
  # ---------------------------------------------------------------------------
  e2e-report:
    name: E2E Report
    if: always()
    needs: [e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - run: bun install --frozen-lockfile
      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true
      - name: Merge into HTML report
        run: bunx playwright merge-reports --reporter=html ./all-blob-reports
      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Auditoria pós-merge — só roda em main após e2e + quality-gate passarem.
  # ---------------------------------------------------------------------------
  post-merge-audit:
    name: Post-merge Simulation Audit
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [quality-gate, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Simulation Audit
        run: |
          curl -fsS -X POST "${{ secrets.SUPABASE_URL }}/functions/v1/webhook-simulator" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"target_function": "asaas-webhook", "scenarios_count": 100, "mode": "stress"}'

