name: CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ main, master, develop ]

jobs:
  quality-gate:
    name: Quality Gate & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # env de nível de job: `if:` de step só enxerga env de workflow/job, NUNCA
    # o próprio `env:` daquele step (a condição decide se o step roda ANTES do
    # runner aplicar o env dele — confirmado na doc oficial do GitHub Actions).
    # Sem isto, todo `if: ${{ env.DATABASE_URL != '' }}` abaixo resolve sempre
    # para falso e o step correspondente fica SEMPRE skipped, mesmo com o
    # secret configurado — foi exatamente o que aconteceu com o gate que roda
    # supabase/tests/sql/rls_multi_empresa.sql: nunca executou de verdade em
    # nenhum commit (confirmado via API de jobs do GitHub, status "skipped"),
    # o que por sua vez explica como o vazamento cross-tenant original (PR #54)
    # sobreviveu meses sem o CI acusar nada.
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # bun.lock usa o formato de texto (lockfileVersion/configVersion 1),
          # suportado a partir do Bun 1.2+. A versão 1.1.42 falhava com
          # "Unknown lockfile version" no install --frozen-lockfile.
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Security scan
        run: bun audit || echo "::warning::bun audit reported vulnerabilities — see logs"

      - name: External secret isolation guard
        # Impede que EXTERNAL_SUPABASE_SERVICE_ROLE_KEY seja lido fora da
        # Edge Function `external-data`. Ver docs/AUDITORIA_BACKEND_SENIOR.md.
        run: bash scripts/check-external-secret-isolation.sh

      - name: Zod coverage gate (edge functions)
        # Falha se novas funções chegarem sem validatePayload (Zod).
        run: bash scripts/security/zod-coverage.sh

      - name: Lint check
        run: bun run lint


      - name: Observability privileges guard (psql)
        # Falha o pipeline se alguma função SECURITY DEFINER de observabilidade
        # regredir privilégios EXECUTE para anon/PUBLIC/authenticated.
        # Requer secret DATABASE_URL apontando para o Postgres do Supabase.
        if: ${{ env.DATABASE_URL != '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f scripts/security/test-observability-privileges.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f scripts/security/test-security-definer-invocation.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f supabase/tests/sql/rls_multi_empresa.sql

      - name: Integridade dos catálogos tributários (pgTAP)
        # Valida PK/UNIQUE, enums, formatos e ranges das tabelas fiscais
        # carregadas por seeds. Falha o build em qualquer "not ok".
        if: ${{ env.DATABASE_URL != '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f supabase/tests/sql/catalogos_tributarios.test.sql 2>&1 | tee catalogos.tap
          if grep -q "not ok" catalogos.tap; then
            echo "::error::Catálogos tributários com invariantes violadas."
            grep "not ok" catalogos.tap
            exit 1
          fi
          echo "✅ Catálogos tributários íntegros."

      - name: Gate #35 — Governança de retenção de dados
        # Falha o build se alguma tabela de log/histórico/telemetria com coluna
        # temporal for criada sem política em public.retencao_politicas (TTL ou
        # isenção justificada), ou se uma política existente apontar para uma
        # coluna temporal inexistente.
        if: ${{ env.DATABASE_URL != '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f scripts/integrity/14_retencao.sql 2>&1 | tee retencao.tsv
          if grep -qP '\tfail\t' retencao.tsv; then
            echo "::error::Gate #35 reprovado — tabela de log sem política de retenção."
            grep -P '\tfail\t' retencao.tsv
            exit 1
          fi
          echo "✅ Gate #35 aprovado."


      - name: Runtime RPC privilege matrix (anon / authenticated)
        # Invoca cada RPC sensível via /rest/v1/rpc/<fn> como anon e usuário
        # autenticado. O papel service_role é validado apenas pelo gate SQL,
        # sem expor sua chave a um probe HTTP de produção.
        if: ${{ env.SUPABASE_URL != '' && env.SUPABASE_ANON_KEY != '' && env.E2E_USER_EMAIL != '' && env.E2E_USER_PASSWORD != '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          # Segredo compartilhado com a edge function ci-security-gate-log.
          # Quando presente, o script registra automaticamente cada falha em
          # public.ci_security_gate_events com git_sha e run URL.
          CI_GATE_LOG_SECRET: ${{ secrets.CI_GATE_LOG_SECRET }}
          MIGRATION_REVISION: ${{ github.sha }}
        run: bun run scripts/security/test-rpc-runtime.ts

      - name: Export function privileges snapshot (CSV + JSON)

        # Gera um resumo por função × role para inspeção e download no CI.
        # Não falha o build — o gate acima já cobre regressões.
        if: ${{ env.DATABASE_URL != '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OUT_DIR: ./artifacts/security
        run: bash scripts/security/export-function-privileges.sh

      - name: Upload function privileges artifact
        if: ${{ env.DATABASE_URL != '' && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: function-privileges
          path: artifacts/security/function-privileges.*
          if-no-files-found: warn
          retention-days: 30




      - name: Type check
        run: bun run type-check

      - name: Unit & Integration Tests
        run: bun run test:run

      - name: Coverage check
        run: bun run test:coverage

      - name: Build check
        run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Upload Error Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-error-logs
          path: "*.log"
          retention-days: 7

  # ---------------------------------------------------------------------------
  # E2E — job único para reutilizar uma única autenticação. Os antigos três
  # shards faziam login simultâneo com o mesmo usuário e acionavam o rate limit
  # do Supabase Auth, produzindo cascatas de falsos negativos.
  # ---------------------------------------------------------------------------
  e2e:
    name: E2E Tests (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      - name: E2E Tests (chromium)
        run: bunx playwright test --project=chromium --reporter=list
        env:
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          ENABLE_AUTHENTICATED_VISUAL_SNAPSHOTS: ${{ vars.ENABLE_AUTHENTICATED_VISUAL_SNAPSHOTS }}
          CI: true

  # ---------------------------------------------------------------------------
  # Fluxo destrutivo de logout real — isolado dos shards regulares para não
  # revogar a sessão compartilhada durante a suíte autenticada.
  # ---------------------------------------------------------------------------
  e2e-destructive:
    name: E2E Destructive Logout
    needs: [e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        id: pw-cache-destructive
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Playwright browsers
        if: steps.pw-cache-destructive.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.pw-cache-destructive.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      - name: E2E Logout Destrutivo
        run: bunx playwright test -c playwright.destructive.config.ts --project=chromium-destructive --reporter=list
        env:
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          CI: true

  # ---------------------------------------------------------------------------
  # Auditoria pós-merge — só roda em main após e2e + quality-gate passarem.
  # ---------------------------------------------------------------------------
  post-merge-audit:
    name: Post-merge Simulation Audit
    # Stress em produção é mutável e deve ser opt-in, com a variável de
    # repositório explicitamente habilitada durante uma janela autorizada.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.ENABLE_PRODUCTION_SIMULATION_AUDIT == 'true'
    needs: [quality-gate, e2e, e2e-destructive]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Simulation Audit
        run: |
          curl -fsS -X POST "${{ secrets.SUPABASE_URL }}/functions/v1/webhook-simulator" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"target_function": "asaas-webhook", "scenarios_count": 100, "mode": "stress"}'
