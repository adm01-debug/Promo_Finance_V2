name: prod-migrate

# Aplica em PROD as migrations de supabase/migrations/ ainda pendentes.
#
# Gates (nesta ordem):
#   1. workflow_dispatch manual — nunca automático em push/schedule.
#   2. environment "Production-Ops" — exige aprovação humana no GitHub
#      (required reviewer + deploys só de branch protegida).
#   3. Confirmação digitada do project-ref de PROD.
#   4. dry_run=true por padrão: primeiro rode só a listagem, depois aplique.
#
# Por que existe: hoje `supabase db push` em prod é feito manualmente da
# máquina de alguém, sem registro e sem revisão. Este workflow registra o
# diff aplicado como artefato e exige approval antes de tocar em PROD.

on:
  workflow_dispatch:
    inputs:
      confirmar_project_ref:
        description: 'Digite o project-ref de PROD para confirmar: bwwbeyolnnzppeuhgkcd'
        required: true
        type: string
      dry_run:
        description: 'Apenas listar migrations pendentes, sem aplicar'
        type: boolean
        default: true

concurrency:
  group: prod-migrate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Job de pré-requisito SEM environment: verifica se os secrets de repositório
  # estão configurados ANTES de solicitar aprovação no Production-Ops.
  # Quando ausentes, termina com success + warning e o job migrate fica skipped.
  # Quando presentes, sinaliza ready=true e o migrate roda normalmente.
  #
  # Nota técnica: secrets.PROD_DB_URL e secrets.SUPABASE_ACCESS_TOKEN são
  # secrets de REPOSITÓRIO (não de environment), portanto acessíveis aqui.
  # Secrets exclusivos do environment Production-Ops seriam inacessíveis, mas
  # nenhum secret crítico deste workflow é exclusivo de environment.
  check-secrets:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Verificar secrets de repositório obrigatórios
        id: check
        env:
          HAS_PROD_DB_URL: ${{ secrets.PROD_DB_URL != '' }}
          HAS_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
        run: |
          MISSING=()
          [ "$HAS_PROD_DB_URL" = "false" ]           && MISSING+=("PROD_DB_URL")
          [ "$HAS_SUPABASE_ACCESS_TOKEN" = "false" ] && MISSING+=("SUPABASE_ACCESS_TOKEN")

          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::warning::Secrets ausentes: ${MISSING[*]}"
            echo "::warning::Configure em Settings → Secrets → Actions antes de rodar prod-migrate."
            echo "::warning::Ver PENDENCIAS.md item 1 para instruções detalhadas."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "Secrets verificados. Prosseguindo para aprovação e migrate."
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  migrate:
    needs: check-secrets
    if: needs.check-secrets.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Ref guard: workflow_dispatch pode ser disparado de qualquer branch;
    # aplicar migrations de uma ref não integrada em PROD não é permitido
    # (mesmo padrão de functions-deploy.yml).
    # Gate de aprovação: o job só inicia depois que um reviewer aprova
    # no Environment "Production-Ops" (proteção do repo).
    environment: Production-Ops
    env:
      PROD_DB_URL: ${{ secrets.PROD_DB_URL }}
      PROD_PROJECT_REF: ${{ vars.PROD_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Instalar utilitários
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.22.6

      - name: Guard-rails de confirmação
        env:
          CONFIRMADO: ${{ inputs.confirmar_project_ref }}
        run: |
          set -euo pipefail
          # O ref canônico é fixo no guard-rail: a variável de repo só pode
          # confirmá-lo, nunca movê-lo — senão apontar PROD_PROJECT_REF para
          # outro projeto faria a confirmação digitada aprovar esse projeto.
          EXPECTED="bwwbeyolnnzppeuhgkcd"
          if [ -n "${PROD_PROJECT_REF:-}" ] && [ "$PROD_PROJECT_REF" != "$EXPECTED" ]; then
            echo "::error::vars.PROD_PROJECT_REF='$PROD_PROJECT_REF' difere do ref canônico $EXPECTED — corrija ou remova a variável"
            exit 1
          fi
          if [ "$CONFIRMADO" != "$EXPECTED" ]; then
            echo "::error::confirmar_project_ref '$CONFIRMADO' != '$EXPECTED'"
            exit 1
          fi
          # Defesa em profundidade: a URL apontada precisa ser do projeto certo.
          case "$PROD_DB_URL" in
            *"$EXPECTED"*) ;;
            *) echo "::error::PROD_DB_URL não pertence ao project-ref $EXPECTED"; exit 1 ;;
          esac
          echo "Projeto de destino confirmado: $EXPECTED"

      - name: Migrations pendentes em PROD
        run: |
          set -o pipefail
          supabase migration list --db-url "$PROD_DB_URL" 2>&1 | tee /tmp/migration-list.txt

      - name: Gate — divergência histórica do ledger
        # docs/AUDITORIA_SINCRONIA_2026-09-17.md registra centenas de versões
        # só locais e poucas em comum com o ledger remoto. `db push` aplica
        # TUDO o que não consta do ledger — se houver versão pendente mais
        # antiga que a última aplicada, o push tentaria reaplicar histórico
        # contra schema existente (falha parcial = pior cenário). Só é
        # seguro aplicar quando toda pendente é estritamente mais nova que
        # o máximo remoto (migrations novas no fim da fila).
        run: |
          set -euo pipefail
          # Versões aplicadas no ledger remoto
          psql "$PROD_DB_URL" -Atc \
            "SELECT version FROM supabase_migrations.schema_migrations" \
            | sort -n > /tmp/ledger-remoto.txt
          MAX_REMOTO=$(tail -1 /tmp/ledger-remoto.txt || true)
          if [ -z "$MAX_REMOTO" ]; then
            echo "::error::ledger remoto vazio ou supabase_migrations.schema_migrations inacessível — reconcile o ledger antes de aplicar."
            exit 1
          fi
          # Versões locais pendentes (não constam do ledger)
          DIVERGENTES=0
          for f in supabase/migrations/*.sql; do
            bn=$(basename "$f")
            # Artefatos fora do fluxo rastreável não contam como divergência:
            #  - UUID companion do Lovable (efeitos já no banco via ledger)
            #  - arquivos pré-bootstrap (versão inválida p/ schema_migrations)
            case "$bn" in
              001_*|002_*|003_*) continue ;;
              20241231000000_*|20241231000001_*) continue ;;
              20251231000001_*|20251231000002_*|20251231000003_*) continue ;;
              20251231000100_*|20251231000200_*|20251231000300_*) continue ;;
              *_ledger_reconciliado.sql) continue ;;
              *_????????-????-????-????-????????????.sql) continue ;;
            esac
            V=$(basename "$f" | cut -d_ -f1)
            if ! grep -qx "$V" /tmp/ledger-remoto.txt; then
              if [ "$V" -le "$MAX_REMOTO" ]; then
                DIVERGENTES=$((DIVERGENTES + 1))
              fi
            fi
          done
          echo "Última versão no ledger remoto: $MAX_REMOTO — pendentes fora de ordem: $DIVERGENTES"
          if [ "$DIVERGENTES" -gt 0 ]; then
            echo "::error::Ledger divergente: $DIVERGENTES migration(s) local(is) anteriores ao máximo remoto ($MAX_REMOTO) não constam do ledger. Reconcile com 'supabase migration repair' antes de aplicar — db push as reaplicaria parcialmente."
            exit 1
          fi

      - name: Dry-run — parar aqui sem aplicar
        if: inputs.dry_run
        run: echo "dry_run=true — nada aplicado. Re-dispare com dry_run=false para aplicar."

      - name: Snapshot do schema antes do apply
        if: '!inputs.dry_run'
        run: |
          pg_dump --schema-only --no-owner --no-privileges "$PROD_DB_URL" \
            > /tmp/prod-schema-antes.sql
          wc -l /tmp/prod-schema-antes.sql

      - name: Aplicar migrations em PROD
        id: apply
        if: '!inputs.dry_run'
        run: |
          set -o pipefail
          supabase db push --db-url "$PROD_DB_URL" 2>&1 | tee /tmp/db-push.log

      - name: Verificação pós-apply (drift)
        # Roda também quando o apply falha (é aí que o estado real de PROD mais
        # importa) e nunca deixa as 3 verificações seguintes caírem em
        # "skipped". Antes, um erro neste passo saía com exit 1 e buckets,
        # supabase_realtime e security_invoker eram pulados em silêncio.
        if: ${{ !cancelled() && !inputs.dry_run && steps.apply.outcome != 'skipped' }}
        run: |
          set -uo pipefail
          FALHA=0
          # 0 = ledger de PROD ilegivel: a paridade NAO foi confirmada.
          LEDGER_OK=0
          LEDGER_ESTADO=ilegivel

          # 1) Convergência do ledger — não depende de shadow DB.
          #    Depois do apply, nenhuma migration local pode seguir pendente.
          if psql "$PROD_DB_URL" -Atc \
               "SELECT version FROM supabase_migrations.schema_migrations" \
               | sort -n > /tmp/ledger-pos.txt && [ -s /tmp/ledger-pos.txt ]; then
            LEDGER_OK=1
            LEDGER_ESTADO=ok
            PENDENTES=0
            for f in supabase/migrations/*.sql; do
              bn=$(basename "$f")
              # Mesmas exclusões do gate de ledger: artefatos fora do fluxo
              # rastreável não contam como migration pendente.
              case "$bn" in
                001_*|002_*|003_*) continue ;;
                20241231000000_*|20241231000001_*) continue ;;
                20251231000001_*|20251231000002_*|20251231000003_*) continue ;;
                20251231000100_*|20251231000200_*|20251231000300_*) continue ;;
                *_ledger_reconciliado.sql) continue ;;
                *_????????-????-????-????-????????????.sql) continue ;;
              esac
              V=$(echo "$bn" | cut -d_ -f1)
              if ! grep -qx "$V" /tmp/ledger-pos.txt; then
                echo "  pendente no ledger: $bn"
                PENDENTES=$((PENDENTES + 1))
              fi
            done
            if [ "$PENDENTES" -gt 0 ]; then
              LEDGER_ESTADO=pendente
              echo "::error::db push não convergiu: $PENDENTES migration(s) local(is) seguem fora do ledger de PROD."
              FALHA=1
            else
              echo "Ledger em paridade: todas as migrations locais estão aplicadas em PROD."
            fi
          else
            echo "::error::ledger de PROD ilegível ou vazio — convergência não verificada."
            FALHA=1
          fi

          echo "ledger de PROD: $LEDGER_ESTADO"

          # 2) Diff de DDL — advisory, por limitação comprovada do harness.
          #    `supabase db diff` replica TODA a história de supabase/migrations/
          #    dentro de um shadow DB e a replicação aborta em statements que
          #    dependem de ownership/estado de PROD. Evidência (run real
          #    45617479444, artefato prod-diff-pos.sql, 20260825090000:88):
          #      ERROR: must be owner of extension pg_stat_statements (SQLSTATE 42501)
          #    Falhar por isso era falso negativo permanente — e ainda escondia
          #    as verificações seguintes. Só é divergência quando o CLI roda e
          #    devolve DDL.
          if supabase db diff --db-url "$PROD_DB_URL" --schema public,storage \
               > /tmp/prod-diff-pos.sql 2>&1; then
            if grep -qiE '^\s*(create|alter|drop|grant|revoke|insert into|update |delete from|comment on|truncate )\b' /tmp/prod-diff-pos.sql; then
              echo "::error::Ainda há diff entre migrations/ e PROD — revisar o artefato prod-diff-pos.sql."
              FALHA=1
            elif grep -qi 'no schema changes' /tmp/prod-diff-pos.sql; then
              echo "PROD em paridade com supabase/migrations/ (schemas: public, storage)."
            else
              echo "::error::db diff não retornou DDL nem marcador de paridade — revisar o artefato."
              FALHA=1
            fi
          else
            grep -m1 -E '^ERROR' /tmp/prod-diff-pos.sql || true
            # Exige os dois: a classe de erro E a prova de que o aborto foi
            # dentro do replay ('Applying migration' no log). Sem isso, um erro de
            # conexao anterior ao replay seria arquivado como limitacao conhecida.
            # Colisao de replay nao e divergencia de PROD: 39 migrations fazem
            # INSERT em supabase_migrations.schema_migrations e batem no insert do
            # proprio CLI.
            if grep -q 'Applying migration' /tmp/prod-diff-pos.sql &&
              grep -qE 'ERROR.*(42501|must be owner|23505|42P07|42710|42701|42P06|duplicate key value|already exists)' /tmp/prod-diff-pos.sql; then
              # O aviso de paridade so vale com o ledger LIDO E EM PARIDADE:
              # `LEDGER_OK` marca apenas que o ledger foi lido, e com migration
              # pendente a afirmacao "ledger: ok" contradiria o proprio estado.
              if [ "$LEDGER_OK" = 1 ] && [ "$LEDGER_ESTADO" = ok ]; then
                echo "::warning::Diff de DDL nao verificavel: o shadow replay abortou por limitacao conhecida do harness (ownership ou colisao de replay). Paridade conferida apenas pelo ledger de PROD (ledger: ok)."
              else
                echo "::error::Diff de DDL nao verificavel E ledger de PROD nao conferido (ledger: $LEDGER_ESTADO) - paridade com migrations/ NAO verificada."
                FALHA=1
              fi
            else
              echo "::error::db diff falhou fora do replay ou por classe inesperada (sem aborto do replay com erro de classe conhecida) - DDL de PROD NAO verificado."
              FALHA=1
            fi
          fi

          exit "$FALHA"

      - name: Verificar buckets esperados em PROD
        if: ${{ !cancelled() && !inputs.dry_run && steps.apply.outcome != 'skipped' }}
        # db diff não rastreia DML — buckets criados por INSERT INTO
        # storage.buckets nas migrations precisam de verificação explícita.
        run: |
          set -euo pipefail
          # Buckets criados por migrations versionadas deste repo
          # ('uploads' existe só comentado numa migration — não é esperado).
          # Existir não basta: um bucket que virou público expõe certificados
          # e documentos financeiros, e drift de limite/MIME nos buckets NF-e
          # muda o que pode ser gravado. Compara a configuração, não só a linha.
          ESPERADOS=(financeiro nfe-certificados nfe-xml notas-fiscais-upload relatorios-tributarios)
          for bucket in "${ESPERADOS[@]}"; do
            PUBLICO=$(psql "$PROD_DB_URL" -Atc \
              "SELECT coalesce(public::text,'<ausente>') FROM storage.buckets WHERE id = '$bucket'")
            if [ "$PUBLICO" != "false" ]; then
              echo "::error::Bucket storage '$bucket' ausente ou público em PROD (public='$PUBLICO')."
              exit 1
            fi
          done
          # nfe-certificados: 5 MiB + PKCS#12/octet-stream; nfe-xml: 50 MiB + XML.
          CONF=$(psql "$PROD_DB_URL" -Atc "
            SELECT count(*) FROM storage.buckets WHERE
              (id='nfe-certificados' AND file_size_limit=5242880
                AND allowed_mime_types='{application/pkcs12,application/x-pkcs12,application/octet-stream}'::text[])
             OR (id='nfe-xml' AND file_size_limit=52428800
                AND allowed_mime_types='{application/xml,text/xml}'::text[])")
          if [ "$CONF" != "2" ]; then
            echo "::error::Buckets NF-e com drift de file_size_limit/allowed_mime_types em PROD."
            exit 1
          fi
          echo "Buckets esperados presentes, privados e com limites/MIME corretos."

      - name: Verificar publicação supabase_realtime em PROD
        if: ${{ !cancelled() && !inputs.dry_run && steps.apply.outcome != 'skipped' }}
        # db diff (engine legado) não cobre membership de publicação — uma
        # tabela removida de supabase_realtime em PROD sairia como paridade.
        # Esperado = união dos ADD TABLE das migrations (incl. EXECUTE
        # dinâmico); divergência em qualquer direção = erro.
        run: |
          set -euo pipefail
          grep -rhoE "supabase_realtime ADD TABLE public\.[a-z_]+" supabase/migrations/ \
            | sed 's/.*public\.//' | sort -u > /tmp/realtime-add.txt
          grep -rhoE "supabase_realtime DROP TABLE public\.[a-z_]+" supabase/migrations/ \
            | sed 's/.*public\.//' | sort -u > /tmp/realtime-drop.txt || true
          comm -23 /tmp/realtime-add.txt /tmp/realtime-drop.txt > /tmp/realtime-esperado.txt
          psql "$PROD_DB_URL" -Atc \
            "SELECT tablename FROM pg_publication_tables WHERE pubname='supabase_realtime' ORDER BY 1" \
            > /tmp/realtime-prod.txt
          if ! diff -u /tmp/realtime-esperado.txt /tmp/realtime-prod.txt; then
            echo "::error::Publicação supabase_realtime diverge das migrations — revisar artefato."
            exit 1
          fi
          echo "Publicação supabase_realtime em paridade com migrations/."

      - name: Verificar security_invoker das views em PROD
        if: ${{ !cancelled() && !inputs.dry_run && steps.apply.outcome != 'skipped' }}
        # O db diff do engine legado (migra) pode não detectar
        # security_invoker de views — uma view que perdeu o atributo em PROD
        # sairia como paridade rodando com privilégio do owner (bypass de
        # RLS). Confere reloptions de cada view que as migrations marcam.
        run: |
          set -euo pipefail
          grep -rhoE "ALTER VIEW public\.[a-z0-9_]+ SET \(security_invoker" supabase/migrations/ \
            | sed -E 's/ALTER VIEW public\.([a-z0-9_]+).*/\1/' | sort -u \
            > /tmp/si-esperado.txt
          # Views criadas já com o atributo: o WITH (security_invoker)
          # precisa pertencer ao mesmo CREATE VIEW — por isso o match é
          # multiline dentro do statement, não um grep solto no arquivo.
          perl -0777 -ne 'while (/CREATE (?:OR REPLACE )?VIEW public\.([a-z0-9_]+)[^;]*?WITH\s*\(\s*security_invoker/gi) { print "$1\n" }' \
            supabase/migrations/*.sql | sort -u >> /tmp/si-esperado.txt || true
          sort -u -o /tmp/si-esperado.txt /tmp/si-esperado.txt
          # Views removidas de proposito por migration versionada
          # (20261118003500_drop_particoes_orfas_e_views_mortas.sql:71-73):
          # exigir security_invoker delas reprovava todo apply bem-sucedido.
          sed -i '/^\(vw_notification_history_duplicates\|vw_rpc_hotspots\|vw_rpc_slow_calls\)$/d' /tmp/si-esperado.txt
          # Mas se alguma reaparecer em PROD sem o atributo, o guard reprova
          # (mesma logica do ADR-001): ausencia e o estado canonico, presenca
          # sem security_invoker e vazamento de privilegio do owner.
          REAPARECIDAS=$(psql "$PROD_DB_URL" -Atc \
            "SELECT string_agg(c.relname, ',') FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relkind IN ('v','m') AND COALESCE(array_to_string(c.reloptions,','),'') !~ 'security_invoker\\s*=\\s*(true|on|1|yes)' AND c.relname IN ('vw_notification_history_duplicates','vw_rpc_hotspots','vw_rpc_slow_calls')")
          if [ -n "$REAPARECIDAS" ]; then
            echo "::error::Views removidas por migration reapareceram em PROD sem security_invoker ($REAPARECIDAS)."
            exit 1
          fi
          # Views Lalamove listadas em docs/ADR-001-LALAMOVE-FORA-DE-ESCOPO.md
          # (drivers_safe_view, orders_safe_view): o estado canônico é AUSENTE
          # em PROD. Saem da lista esperada, mas o guard falha se reaparecerem.
          sed -i '/^\(drivers_safe_view\|orders_safe_view\)$/d' /tmp/si-esperado.txt
          LALAMOVE_EM_PROD=$(psql "$PROD_DB_URL" -Atc \
            "SELECT string_agg(c.relname, ',') FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relname IN ('drivers_safe_view','orders_safe_view')")
          if [ -n "$LALAMOVE_EM_PROD" ]; then
            echo "::error::Objetos Lalamove presentes em PROD ($LALAMOVE_EM_PROD) — ADR-001 exige ausência."
            exit 1
          fi
          # orders_operator_view não está no ADR-001: é derivada de
          # lalamove_orders (tabela do ADR) e a própria migration
          # 20260825100000_reconciliar_schema_completo.sql ignora a criação em
          # undefined_table. Ausente em PROD, sai da lista; se existir, segue
          # na conferência normal de security_invoker.
          if [ -z "$(psql "$PROD_DB_URL" -Atc "SELECT to_regclass('public.orders_operator_view')")" ]; then
            sed -i '/^orders_operator_view$/d' /tmp/si-esperado.txt
          fi
          # estrategias_elisao_catalogo é TABELA em PROD (relkind 'r', RLS
          # ligado), não view: as migrations a declaram view
          # (20260728154640_2b62d1ef-…sql:62 e
          # 20260825100000_reconciliar_schema_completo.sql:10803), mas PROD
          # manteve a tabela. Sem view não há security_invoker a conferir.
          # A exceção só vale enquanto o objeto for tabela COM RLS ligado: se
          # virar view, volta a ser conferido; se for tabela sem RLS, falha.
          CATALOGO=$(psql "$PROD_DB_URL" -Atc \
            "SELECT c.relkind::text || ':' || c.relrowsecurity::text FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relname='estrategias_elisao_catalogo'")
          if [ "$CATALOGO" = "r:true" ]; then
            sed -i '/^estrategias_elisao_catalogo$/d' /tmp/si-esperado.txt
          elif [ "${CATALOGO%%:*}" = "r" ]; then
            echo "::error::estrategias_elisao_catalogo é tabela em PROD sem RLS ($CATALOGO) — escrita sem as policies de admin."
            exit 1
          fi
          # Só conta como protegida se o valor for verdadeiro — um
          # security_invoker=false gravado em PROD não satisfaz a matriz.
          psql "$PROD_DB_URL" -Atc \
            "SELECT c.relname FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relkind IN ('v','m') AND COALESCE(array_to_string(c.reloptions,','),'') ~ 'security_invoker\s*=\s*(true|on|1|yes)' ORDER BY 1" \
            > /tmp/si-prod.txt
          comm -23 /tmp/si-esperado.txt /tmp/si-prod.txt > /tmp/si-faltando.txt || true
          if [ -s /tmp/si-faltando.txt ]; then
            cat /tmp/si-faltando.txt
            echo "::error::Views acima perderam security_invoker em PROD — rodando com privilégio do owner."
            exit 1
          fi
          echo "$(wc -l < /tmp/si-esperado.txt) views com security_invoker conferidas em PROD."

      - name: Upload evidências
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: prod-migrate-evidencias
          path: |
            /tmp/migration-list.txt
            /tmp/db-push.log
            /tmp/prod-schema-antes.sql
            /tmp/prod-diff-pos.sql
          retention-days: 90
