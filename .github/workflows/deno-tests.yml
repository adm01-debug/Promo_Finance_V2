name: Deno Edge Function Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

# Cancela runs anteriores no mesmo branch para economizar minutos.
concurrency:
  group: deno-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (offline, determinísticos)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          # Mesma versão usada para validar as regras de lint deste workflow.
          deno-version: v2.9.5

      - name: Cache Deno dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/deno
            ~/.deno
          key: deno-${{ runner.os }}-${{ hashFiles('supabase/functions/**/*.ts') }}
          restore-keys: |
            deno-${{ runner.os }}-

      - name: Lint do escopo crítico alterado
        # Dívida legada explícita: o repositório ainda usa imports HTTPS e
        # mantém `any`/variáveis ociosas em funções antigas. O lint global
        # reprova por esse baseline. Este gate é bloqueante para todas as demais
        # regras nos guards, no mcp-query e nas funções/testes endurecidos.
        run: |
          deno lint --no-config \
            --rules-exclude=no-import-prefix,no-explicit-any,no-unused-vars,prefer-const,require-await \
            supabase/functions/_shared/auth-guard.ts \
            supabase/functions/_shared/auth-guard_test.ts \
            supabase/functions/_shared/proxy-audit.ts \
            supabase/functions/_shared/sql-write-guard.ts \
            supabase/functions/_shared/sql-write-guard_test.ts \
            supabase/functions/_shared/webhook-auth.ts \
            supabase/functions/_shared/webhook-auth_test.ts \
            supabase/functions/convidar-usuario/index.ts \
            supabase/functions/convidar-usuario/index.test.ts \
            supabase/functions/mcp-query/index.ts \
            supabase/functions/mcp-query/index_test.ts \
            supabase/functions/mcp-query/sql-policy_test.ts \
            supabase/functions/analise-fluxo-ia/index.ts \
            supabase/functions/analise-fluxo-ia/auth_test.ts \
            supabase/functions/analyze-document/index.ts \
            supabase/functions/benchmarking-setorial/index.ts \
            supabase/functions/categorizar-despesa/index.ts \
            supabase/functions/conciliacao-proxy/index.ts \
            supabase/functions/conciliacao-proxy/index_test.ts \
            supabase/functions/nfe-vinculo-proxy/index.ts \
            supabase/functions/nfe-vinculo-proxy/index_test.ts \
            supabase/functions/insights-relatorio/index.ts \
            supabase/functions/enviar-alerta-email/index.ts \
            supabase/functions/enviar-alerta-email/index.test.ts \
            supabase/functions/executar-analise-preditiva/index.ts \
            supabase/functions/executar-analise-preditiva/index.test.ts \
            supabase/functions/gerar-alertas-tributarios/index.ts \
            supabase/functions/gerar-alertas-tributarios/index.test.ts \
            supabase/functions/whatsapp-ia-proativo/index.ts \
            supabase/functions/whatsapp-ia-proativo/index_test.ts

      - name: Type-check do escopo endurecido
        # Escopo focado nas funções endurecidas nesta rodada. O gate global
        # de todo o diretório `supabase/functions` continua bloqueado por
        # dívida histórica fora do escopo desta publicação.
        run: bash scripts/ci/deno-check-functions.sh

      - name: Run unit tests
        # Descoberta por diretório, não lista cravada.
        #
        # A lista anterior enumerava 24 dos 48 arquivos de teste do disco e
        # rodava 185 dos 305 testes: 120 testes — 39% — nunca eram executados
        # no CI, e nada avisava quando um arquivo novo nascia fora da lista.
        # Foi assim que `nfe-vinculo-proxy/index_test.ts` passou a exigir 422
        # de uma função que devolvia 400 sem o gate reprovar, e que o teste de
        # idempotência de `executar-regua-cobranca` ficou inerte no disco.
        #
        # `--allow-net` é escopado ao loopback de propósito. Os testes precisam
        # da permissão só porque vários módulos têm `Deno.serve()` no topo, que
        # faz bind em 0.0.0.0:8000 na importação — nenhum deles deveria falar
        # com a internet. Com o escopo, "offline" passa a ser garantido pelo
        # runtime em vez de por convenção: um teste que vazar para a rede
        # reprova com `NotCapable` em vez de virar dependência silenciosa de
        # produção. Sem o escopo, este job passaria a bater em
        # `bwwbeyolnnzppeuhgkcd.supabase.co` de verdade.
        #
        # `sso-test-login/index.test.ts` fica de fora porque é integração viva
        # contra a função publicada, e roda no job `integration-tests`, que tem
        # os secrets. Sem `--ignore` ele entraria aqui e reprovaria por 401.
        #
        # Custo total: 8s para 301 testes, contra 6s para 185.
        env:
          SUPABASE_URL: http://localhost:54321
          SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
          SUPABASE_ANON_KEY: test-anon-key
          DENO_TESTING: '1'
        run: |
          deno test --no-config \
            --allow-env \
            --allow-read \
            --allow-net=0.0.0.0:8000,127.0.0.1,localhost \
            --no-check \
            --ignore=supabase/functions/sso-test-login/index.test.ts \
            supabase/functions/

  integration-tests:
    name: Integration tests (edge functions live)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: unit-tests
    # PRs externos não recebem secrets e ficam explicitamente fora deste job.
    # Em pushes e PRs internos, ausência de secret reprova o preflight.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5

      - name: Cache Deno dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/deno
            ~/.deno
          key: deno-${{ runner.os }}-${{ hashFiles('supabase/functions/**/*.ts') }}
          restore-keys: |
            deno-${{ runner.os }}-

      - name: Preflight da integração live
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          bash scripts/ci/require-env.sh \
            --label "Deno — integração live" \
            VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY

      - name: Run integration tests against deployed edge functions
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          deno test --no-config \
            --allow-net \
            --allow-env \
            --allow-read \
            --no-check \
            supabase/functions/sso-test-login/index.test.ts
