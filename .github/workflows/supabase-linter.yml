name: Supabase Linter (RLS/GRANT gate)

# Falha o build quando o linter oficial do Supabase reportar novos
# ERRORs relacionados a segurança do banco (RLS ausente, GRANTs faltando,
# políticas permissivas etc.). WARNs são apenas informacionais.
#
# Requer o secret SUPABASE_ACCESS_TOKEN (Personal Access Token) e
# SUPABASE_PROJECT_REF configurados no repositório.

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'scripts/integrity/baseline/**'
      - '.github/workflows/supabase-linter.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'scripts/integrity/baseline/**'
      - '.github/workflows/supabase-linter.yml'
  workflow_dispatch: {}

jobs:
  supabase-linter:
    name: Supabase DB Linter
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Run Supabase linter (fail on ERROR)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF ausentes — pulando linter."
            exit 0
          fi

          # Executa o linter e captura JSON
          supabase db lint \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --linked \
            --level error \
            --output json > lint.json || LINT_EXIT=$?

          echo "── Linter output ──"
          cat lint.json || true

          # Contabiliza apenas ERROR (WARN não bloqueia)
          ERRORS=$(jq '[.[] | select(.level=="ERROR")] | length' lint.json 2>/dev/null || echo 0)
          echo "Errors: $ERRORS"

          if [ "$ERRORS" != "0" ]; then
            echo "::error::Supabase linter detectou $ERRORS ERROR(s) de segurança/RLS/GRANT."
            jq -r '.[] | select(.level=="ERROR") | "❌ [\(.name)] \(.description)"' lint.json
            exit 1
          fi

          echo "✅ Nenhum ERROR de segurança no banco."

      - name: Upload linter report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-lint-report
          path: lint.json
          retention-days: 30

  baseline-drift:
    name: Gate #26 — Drift de schema/policies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Instalar utilitários
        run: sudo apt-get update && sudo apt-get install -y postgresql-client jq

      - name: Comparar banco vs. baseline versionado
        env:
          PROD_DB_URL: ${{ secrets.PROD_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${PROD_DB_URL:-}" ]; then
            echo "::warning::PROD_DB_URL ausente — Gate #26 pulado."
            exit 0
          fi
          bash scripts/ci/check-baseline-drift.sh

  secdef-search-path:
    name: Gate #27 — SECURITY DEFINER com search_path fixo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Instalar utilitários
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Auditar funções SECURITY DEFINER
        env:
          PROD_DB_URL: ${{ secrets.PROD_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${PROD_DB_URL:-}" ]; then
            echo "::error::PROD_DB_URL ausente — Gate #27 não pode ser verificado."
            exit 1
          fi
          OUT=$(psql "$PROD_DB_URL" -v ON_ERROR_STOP=1 -A -t -F $'\t' \
                  -f scripts/integrity/06_secdef.sql)
          echo "$OUT"
          if echo "$OUT" | grep -q $'\tfail\t'; then
            echo "::error::Gate #27 falhou — função SECURITY DEFINER sem search_path fixo/seguro."
            exit 1
          fi
          echo "✅ Gate #27 aprovado."
