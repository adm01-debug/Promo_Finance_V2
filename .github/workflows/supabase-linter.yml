name: Supabase Linter (RLS/GRANT gate)

# Falha o build quando o linter oficial do Supabase reportar novos
# ERRORs relacionados a segurança do banco (RLS ausente, GRANTs faltando,
# políticas permissivas etc.). WARNs são apenas informacionais.
#
# Requer o secret SUPABASE_ACCESS_TOKEN (Personal Access Token) e um project ref
# canônico em `vars.VITE_SUPABASE_PROJECT_ID`. A falta de qualquer um reprova o
# workflow; o banco nunca é dado como validado por ausência de credencial.

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'scripts/ci/require-env.sh'
      - 'scripts/security/test-canonical-db-gates.mjs'
      - 'scripts/security/test-canonical-db-gates.test.mjs'
      - 'scripts/security/test-migration-replay-safety.sh'
      - 'scripts/security/test-lint-function-repairs.mjs'
      - '.github/workflows/supabase-linter.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'scripts/ci/require-env.sh'
      - 'scripts/security/test-canonical-db-gates.mjs'
      - 'scripts/security/test-canonical-db-gates.test.mjs'
      - 'scripts/security/test-migration-replay-safety.sh'
      - 'scripts/security/test-lint-function-repairs.mjs'
      - '.github/workflows/supabase-linter.yml'
  workflow_dispatch: {}

jobs:
  supabase-linter:
    name: Supabase DB Linter
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Gate offline do banco canônico
        run: node --test scripts/security/test-canonical-db-gates.test.mjs

      - name: Replay safety das migrations críticas
        run: bash scripts/security/test-migration-replay-safety.sh

      - name: Gate estático do reparo SQL
        run: node scripts/security/test-lint-function-repairs.mjs

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Preflight dos gates live do Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.VITE_SUPABASE_PROJECT_ID }}
        run: |
          bash scripts/ci/require-env.sh \
            --label "Supabase — banco canônico live" \
            SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF

      - name: Gate live do banco canônico
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.VITE_SUPABASE_PROJECT_ID }}
        run: node scripts/security/test-canonical-db-gates.mjs

      - name: Run Supabase linter (fail on ERROR)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.VITE_SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          lint_exit=0
          supabase db lint \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --linked \
            --level warning \
            --fail-on error \
            --output-format json > lint.json || lint_exit=$?

          echo "── Linter output ──"
          if ! jq -e '
            (type == "object" and (.results | type == "array"))
            or type == "array"
          ' lint.json >/dev/null; then
            echo "::error::Supabase linter não produziu o JSON esperado."
            if [ -s lint.json ]; then
              cat lint.json
            fi
            if [ "$lint_exit" -ne 0 ]; then
              exit "$lint_exit"
            fi
            exit 1
          fi
          cat lint.json

          if [ "$lint_exit" -ne 0 ]; then
            echo "::error::Supabase linter detectou ERROR(s) de segurança/RLS/GRANT."
            jq -r '
              if type == "object" then
                .results[]? as $routine
                | $routine.issues[]?
                | select(((.level // "") | ascii_downcase) == "error")
                | "- [\($routine.function // "desconhecida")] \(.message // "erro sem detalhe")"
              else
                .[]?
                | select(((.level // "") | ascii_downcase) == "error")
                | "- [\(.name // .function // "desconhecida")] \(.description // .message // "erro sem detalhe")"
              end
            ' lint.json
            exit "$lint_exit"
          fi

          if jq -e '
            if type == "object" then
              .results[]?.issues[]?
            else
              .[]?
            end
            | select(((.level // "") | ascii_downcase) == "error")
          ' lint.json >/dev/null; then
            echo "::error::Supabase linter retornou ERROR no JSON com exit code zero."
            jq -r '
              if type == "object" then
                .results[]? as $routine
                | $routine.issues[]?
                | select(((.level // "") | ascii_downcase) == "error")
                | "- [\($routine.function // "desconhecida")] \(.message // "erro sem detalhe")"
              else
                .[]?
                | select(((.level // "") | ascii_downcase) == "error")
                | "- [\(.name // .function // "desconhecida")] \(.description // .message // "erro sem detalhe")"
              end
            ' lint.json
            exit 1
          fi

          echo "✅ Nenhum ERROR bloqueante de segurança no banco."

      - name: Upload linter report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-lint-report
          path: lint.json
          retention-days: 30
