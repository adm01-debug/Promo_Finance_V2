name: Supabase Linter (RLS/GRANT gate)

# Falha o build quando o linter oficial do Supabase reportar novos
# ERRORs relacionados a segurança do banco (RLS ausente, GRANTs faltando,
# políticas permissivas etc.). WARNs são apenas informacionais.
#
# Requer o secret SUPABASE_ACCESS_TOKEN (Personal Access Token) e um project ref
# canônico em `vars.VITE_SUPABASE_PROJECT_ID`. A falta de qualquer um reprova o
# workflow; o banco nunca é dado como validado por ausência de credencial.
#
# O job sempre completa com sucesso em PRs que não tocam arquivos do banco,
# satisfazendo o gate obrigatório sem bloquear PRs de frontend/docs.

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'scripts/ci/require-env.sh'
      - 'scripts/security/test-canonical-db-gates.mjs'
      - 'scripts/security/test-canonical-db-gates.test.mjs'
      - 'scripts/security/test-migration-replay-safety.sh'
      - 'scripts/security/test-supabase-config.py'
      - 'supabase/config.toml'
      - 'scripts/security/test-lint-function-repairs.mjs'
      - 'scripts/security/check-view-replay-order.mjs'
      - '.github/workflows/supabase-linter.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    # Sem filtro paths: — precisa sempre disparar para satisfazer gate obrigatório.
    # O job detecta internamente se arquivos do banco foram alterados e pula
    # o lint quando não há mudanças relevantes.
  workflow_dispatch: {}

# Cancela runs anteriores do mesmo branch — o estado do banco não muda entre
# pushes, então rodar o linter em dois commits intermediários é desperdício.
concurrency:
  group: supabase-linter-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  supabase-linter:
    name: Supabase DB Linter
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Production

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Detect DB file changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            changed=$(curl -sSf \
              --proto '=https' \
              --tlsv1.2 \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
              | jq -r '.[].filename')
            if echo "$changed" | grep -qE '^(supabase/migrations/|supabase/functions/|scripts/security/|scripts/ci/require-env\.sh|supabase/config\.toml|\.github/workflows/supabase-linter\.yml)'; then
              relevant=true
            else
              relevant=false
            fi
          else
            relevant=true
          fi
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          if [ "$relevant" = "true" ]; then
            echo "::notice::Mudanças no banco detectadas — lint será executado."
          else
            echo "::notice::Sem mudanças no banco — lint pulado. Job completa com sucesso."
          fi

      - name: Gate offline do banco canônico
        if: steps.filter.outputs.relevant == 'true'
        run: node --test scripts/security/test-canonical-db-gates.test.mjs

      - name: Replay safety das migrations críticas
        if: steps.filter.outputs.relevant == 'true'
        run: bash scripts/security/test-migration-replay-safety.sh

      - name: Ordem de replay de views (CREATE VIEW nu)
        if: steps.filter.outputs.relevant == 'true'
        # Falha se CREATE VIEW fora de guard DO $$ referenciar coluna criada depois
        # (mesma classe que quebrava Supabase Preview: "column pc.tipo does not exist")
        run: node scripts/security/check-view-replay-order.mjs

      - name: Integridade do Supabase config
        if: steps.filter.outputs.relevant == 'true'
        run: python3 scripts/security/test-supabase-config.py

      - name: Gate estático do reparo SQL
        if: steps.filter.outputs.relevant == 'true'
        run: node scripts/security/test-lint-function-repairs.mjs

      - name: Setup Supabase CLI
        if: steps.filter.outputs.relevant == 'true'
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v1
        with:
          version: 2.22.6

      - name: Inicializar lint.json
        if: steps.filter.outputs.relevant == 'true'
        # Etapa 44: garante que o artefato sempre existe, mesmo se um gate live
        # falhar antes do step "Run Supabase linter". O step de lint sobrescreve.
        run: echo '{"results":[]}' > lint.json

      - name: Preflight dos gates live do Supabase
        if: steps.filter.outputs.relevant == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.VITE_SUPABASE_PROJECT_ID }}
        run: |
          bash scripts/ci/require-env.sh \
            --label "Supabase — banco canônico live" \
            SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF

      - name: Gate live do banco canônico
        if: steps.filter.outputs.relevant == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.VITE_SUPABASE_PROJECT_ID }}
        run: node scripts/security/test-canonical-db-gates.mjs

      - name: Preflight DB password
        if: steps.filter.outputs.relevant == 'true'
        id: db_pwd_preflight
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          bash scripts/ci/require-env.sh \
            --label "Supabase linter — DB password" \
            --mode summary \
            --output available \
            SUPABASE_DB_PASSWORD

      - name: Fail when linter skipped (missing password)
        if: steps.filter.outputs.relevant == 'true' && steps.db_pwd_preflight.outputs.available != 'true'
        run: |
          echo "::error::SUPABASE_DB_PASSWORD não configurado — impossível executar supabase db lint em PR com mudanças de banco. Configure o secret para habilitar a verificação completa de RLS/GRANT."
          exit 1

      - name: Run Supabase linter (fail on ERROR)
        if: steps.filter.outputs.relevant == 'true' && steps.db_pwd_preflight.outputs.available == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.VITE_SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          # Vincula o CLI ao projeto remoto antes de executar o lint.
          # A flag --project-ref não existe em `db lint`; o link é feito aqui.
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          lint_exit=0
          supabase db lint \
            --linked \
            --level warning \
            --output json > lint.json || lint_exit=$?

          echo "── Linter output ──"
          if ! jq -e '
            (type == "object" and (.results | type == "array"))
            or type == "array"
          ' lint.json >/dev/null; then
            echo "::error::Supabase linter não produziu o JSON esperado."
            if [ -s lint.json ]; then
              cat lint.json
            fi
            if [ "$lint_exit" -ne 0 ]; then
              exit "$lint_exit"
            fi
            exit 1
          fi
          cat lint.json

          if [ "$lint_exit" -ne 0 ]; then
            echo "::error::Supabase linter detectou ERROR(s) de segurança/RLS/GRANT."
            jq -r --arg f "desconhecida" --arg m "erro sem detalhe" '
              if type == "object" then
                .results[]? as $routine
                | $routine.issues[]?
                | select((.level // "") | ascii_downcase == "error")
                | "- [\($routine.function // $f)] \(.message // $m)"
              else
                .[]?
                | select((.level // "") | ascii_downcase == "error")
                | "- [\(.name // .function // $f)] \(.description // .message // $m)"
              end
            ' lint.json
            exit "$lint_exit"
          fi

          if jq -e '
            if type == "object" then
              .results[]?.issues[]?
            else
              .[]?
            end
            | select((.level // "") | ascii_downcase == "error")
          ' lint.json >/dev/null; then
            echo "::error::Supabase linter retornou ERROR no JSON com exit code zero."
            jq -r --arg f "desconhecida" --arg m "erro sem detalhe" '
              if type == "object" then
                .results[]? as $routine
                | $routine.issues[]?
                | select((.level // "") | ascii_downcase == "error")
                | "- [\($routine.function // $f)] \(.message // $m)"
              else
                .[]?
                | select((.level // "") | ascii_downcase == "error")
                | "- [\(.name // .function // $f)] \(.description // .message // $m)"
              end
            ' lint.json
            exit 1
          fi

          echo "✅ Nenhum ERROR bloqueante de segurança no banco."

      - name: Upload linter report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: supabase-lint-report
          path: lint.json
          retention-days: 30
