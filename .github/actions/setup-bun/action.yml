name: Setup Bun with cache
description: >
  Checkout + setup-bun (via .bun-version) + node_modules cache + conditional install.
  Eliminates the 5-times-repeated setup block across all CI jobs.

inputs:
  fetch-depth:
    description: Number of commits to fetch (0 = all history)
    default: '1'

outputs:
  cache-hit:
    description: Whether the node_modules cache was restored
    value: ${{ steps.bun-cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      with:
        fetch-depth: ${{ inputs.fetch-depth }}
        persist-credentials: false

    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version-file: .bun-version

    - name: Cache node_modules
      id: bun-cache
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: node_modules
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-

    - name: Install dependencies
      if: steps.bun-cache.outputs.cache-hit != 'true'
      shell: bash
      run: bun install --frozen-lockfile
